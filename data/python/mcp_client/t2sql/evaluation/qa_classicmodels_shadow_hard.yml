cases:
  - id: SH1
    difficulty: hard
    question: "For each customer who has placed at least one order, return the customer number, customer name, and total quantity ordered across all their order lines. Order by total quantity descending, then customer number ascending."
    groundtruth_sql: |
      SELECT
        c.customerNumber,
        c.customerName,
        SUM(od.quantityOrdered) AS total_quantity_ordered
      FROM customers AS c
      JOIN orders AS o
        ON o.customerNumber = c.customerNumber
      JOIN orderdetails AS od
        ON od.orderNumber = o.orderNumber
      GROUP BY c.customerNumber, c.customerName
      ORDER BY total_quantity_ordered DESC, c.customerNumber ASC;
  - id: SH2
    difficulty: hard
    question: "Include every office, even if no customer assigned to its employees has ever made a payment. Return the office code, city, and total payment amount collected from customers assigned to that office. Sort by total payment amount descending, then office code ascending."
    groundtruth_sql: |
      SELECT
        o.officeCode,
        o.city,
        COALESCE(SUM(p.amount), 0) AS total_payment_amount
      FROM offices AS o
      LEFT JOIN employees AS e
        ON e.officeCode = o.officeCode
      LEFT JOIN customers AS c
        ON c.salesRepEmployeeNumber = e.employeeNumber
      LEFT JOIN payments AS p
        ON p.customerNumber = c.customerNumber
      GROUP BY o.officeCode, o.city
      ORDER BY total_payment_amount DESC, o.officeCode ASC;
  - id: SH3
    difficulty: hard
    question: "Return products that have never been ordered. Show the product code, product name, and product line. Sort by product line ascending, then product code ascending."
    groundtruth_sql: |
      SELECT
        p.productCode,
        p.productName,
        p.productLine
      FROM products AS p
      LEFT JOIN orderdetails AS od
        ON od.productCode = p.productCode
      WHERE od.orderNumber IS NULL
      ORDER BY p.productLine ASC, p.productCode ASC;
  - id: SH4
    difficulty: hard
    question: "For each customer with payments, return the customer number, customer name, and the number of distinct years in which they made payments. Keep only customers with payments in at least 2 distinct years. Sort by distinct payment years descending, then customer number ascending."
    groundtruth_sql: |
      SELECT
        c.customerNumber,
        c.customerName,
        COUNT(DISTINCT YEAR(p.paymentDate)) AS distinct_payment_years
      FROM customers AS c
      JOIN payments AS p
        ON p.customerNumber = c.customerNumber
      GROUP BY c.customerNumber, c.customerName
      HAVING COUNT(DISTINCT YEAR(p.paymentDate)) >= 2
      ORDER BY distinct_payment_years DESC, c.customerNumber ASC;
  - id: SH5
    difficulty: hard
    question: "For each product line, return the product code, product name, and total quantity ordered for the single most-ordered product in that line. If there is a tie, keep the product with the smaller product code. Sort by product line ascending."
    groundtruth_sql: |
      SELECT
        ranked.productLine,
        ranked.productCode,
        ranked.productName,
        ranked.total_quantity_ordered
      FROM (
        SELECT
          p.productLine,
          p.productCode,
          p.productName,
          SUM(od.quantityOrdered) AS total_quantity_ordered,
          ROW_NUMBER() OVER (
            PARTITION BY p.productLine
            ORDER BY SUM(od.quantityOrdered) DESC, p.productCode ASC
          ) AS rn
        FROM products AS p
        JOIN orderdetails AS od
          ON od.productCode = p.productCode
        GROUP BY p.productLine, p.productCode, p.productName
      ) AS ranked
      WHERE ranked.rn = 1
      ORDER BY ranked.productLine ASC;
  - id: SH6
    difficulty: hard
    question: "For each customer who has placed orders, find the year of their most recent order. Return the customer number, customer name, that latest order year, and how many orders they placed in that same year. Sort by order count descending, then customer number ascending."
    groundtruth_sql: |
      SELECT
        c.customerNumber,
        c.customerName,
        ly.latest_order_year,
        COUNT(o.orderNumber) AS order_count_in_latest_year
      FROM customers AS c
      JOIN (
        SELECT
          customerNumber,
          MAX(YEAR(orderDate)) AS latest_order_year
        FROM orders
        GROUP BY customerNumber
      ) AS ly
        ON ly.customerNumber = c.customerNumber
      JOIN orders AS o
        ON o.customerNumber = c.customerNumber
       AND YEAR(o.orderDate) = ly.latest_order_year
      GROUP BY c.customerNumber, c.customerName, ly.latest_order_year
      ORDER BY order_count_in_latest_year DESC, c.customerNumber ASC;
  - id: SH7
    difficulty: hard
    question: "Find offices that have at least one employee but no employees who report to a manager. Return the office code, city, and total employee count. Sort by office code ascending."
    groundtruth_sql: |
      SELECT
        o.officeCode,
        o.city,
        COUNT(e.employeeNumber) AS total_employee_count
      FROM offices AS o
      JOIN employees AS e
        ON e.officeCode = o.officeCode
      GROUP BY o.officeCode, o.city
      HAVING COUNT(e.employeeNumber) > 0
         AND SUM(CASE WHEN e.reportsTo IS NOT NULL THEN 1 ELSE 0 END) = 0
      ORDER BY o.officeCode ASC;
  - id: SH8
    difficulty: hard
    question: "For each employee who manages at least one customer, return the employee number, employee name, and the latest payment date made by any of that employee's customers. Sort by latest payment date descending, then employee number ascending."
    groundtruth_sql: |
      SELECT
        e.employeeNumber,
        CONCAT(e.firstName, ' ', e.lastName) AS employee_name,
        MAX(p.paymentDate) AS latest_customer_payment_date
      FROM employees AS e
      JOIN customers AS c
        ON c.salesRepEmployeeNumber = e.employeeNumber
      JOIN payments AS p
        ON p.customerNumber = c.customerNumber
      GROUP BY e.employeeNumber, e.firstName, e.lastName
      ORDER BY latest_customer_payment_date DESC, e.employeeNumber ASC;
  - id: SH9
    difficulty: hard
    question: "Return customers who have placed orders but never made any payments. Show the customer number, customer name, and total number of orders. Sort by total orders descending, then customer number ascending."
    groundtruth_sql: |
      SELECT
        c.customerNumber,
        c.customerName,
        COUNT(o.orderNumber) AS total_orders
      FROM customers AS c
      JOIN orders AS o
        ON o.customerNumber = c.customerNumber
      LEFT JOIN payments AS p
        ON p.customerNumber = c.customerNumber
      GROUP BY c.customerNumber, c.customerName
      HAVING COUNT(p.checkNumber) = 0
      ORDER BY total_orders DESC, c.customerNumber ASC;
  - id: SH10
    difficulty: hard
    question: "For each product that has been ordered, return the product line, product code, product name, total ordered quantity, and the rank by total ordered quantity inside the product line from highest to lowest. Sort by product line ascending, then rank, then product code."
    groundtruth_sql: |
      SELECT
        p.productLine,
        p.productCode,
        p.productName,
        SUM(od.quantityOrdered) AS total_ordered_quantity,
        DENSE_RANK() OVER (
          PARTITION BY p.productLine
          ORDER BY SUM(od.quantityOrdered) DESC
        ) AS quantity_rank_in_line
      FROM products AS p
      JOIN orderdetails AS od
        ON od.productCode = p.productCode
      GROUP BY p.productLine, p.productCode, p.productName
      ORDER BY p.productLine ASC, quantity_rank_in_line ASC, p.productCode ASC;
