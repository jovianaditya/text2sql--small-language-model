cases:
    - id: H1
      difficulty: hard
      question: "For each customer, return the customer name, customer ID, and total payment amount in 2004, but only include customers whose total is greater than 50,000."
      groundtruth_sql: |
        SELECT
          cust.customerNumber,
          cust.customerName,
          SUM(pmt.amount) AS total_payment_amount
        FROM customers AS cust
        LEFT JOIN payments AS pmt ON cust.customerNumber = pmt.customerNumber AND YEAR(pmt.paymentDate) = 2004
        GROUP BY cust.customerNumber, cust.customerName
        HAVING SUM(pmt.amount) > 50000;
    - id: H2
      difficulty: hard
      question: "Only include customers who have placed orders, and for each such customer return the customer number, customer name, and total number of orders they have placed."
      groundtruth_sql: |
        SELECT
          cust.customerNumber,
          cust.customerName,
          COUNT(ord.orderNumber) AS total_orders
        FROM customers AS cust
        JOIN orders AS ord ON cust.customerNumber = ord.customerNumber
        GROUP BY cust.customerNumber, cust.customerName;
    - id: H3
      difficulty: hard
      question: "List only products that have been ordered at least once, and for each such product return the product code, product name, and total quantity ordered."
      groundtruth_sql: |
        SELECT
          p.productCode,
          p.productName,
          SUM(od.quantityOrdered) AS total_quantity_ordered
        FROM products AS p
        JOIN orderdetails AS od
          ON p.productCode = od.productCode
        GROUP BY p.productCode, p.productName;
    - id: H4
      difficulty: hard
      question: "For customers who have placed orders, return the customer number, customer name, and total order amount, where total order amount is the sum of quantity ordered multiplied by price each."
      groundtruth_sql: |
        SELECT
          cust.customerNumber,
          cust.customerName,
          SUM(od.quantityOrdered * od.priceEach) AS total_order_amount
        FROM customers AS cust
        JOIN orders AS ord
          ON cust.customerNumber = ord.customerNumber
        JOIN orderdetails AS od
          ON ord.orderNumber = od.orderNumber
        GROUP BY cust.customerNumber, cust.customerName;
    - id: H5
      difficulty: hard
      question: "For every employee, including employees who do not manage any customers and customers who have never made any payments, return the employee number, employee name, and the total payment amount collected from their customers."
      groundtruth_sql: |
        SELECT
          emp.employeeNumber,
          CONCAT(emp.firstName, ' ', emp.lastName) AS employee_name,
          SUM(pmt.amount) AS total_payment_amount
        FROM employees AS emp
        LEFT JOIN customers AS cust
          ON emp.employeeNumber = cust.salesRepEmployeeNumber
        LEFT JOIN payments AS pmt
          ON cust.customerNumber = pmt.customerNumber
        GROUP BY
          emp.employeeNumber,
          emp.firstName,
          emp.lastName;
    - id: H6
      difficulty: hard
      question: "Show only products that have been ordered, and for each such product return the product code, product name, and the rank based on total sales value calculated using the actual price charged on each order line, in descending order."
      groundtruth_sql: |
        SELECT
          p.productCode,
          p.productName,
          RANK() OVER (
            ORDER BY SUM(od.quantityOrdered * od.priceEach) DESC
          ) AS sales_rank
        FROM products AS p
        JOIN orderdetails AS od
          ON p.productCode = od.productCode
        GROUP BY p.productCode, p.productName;
    - id: H7
      difficulty: hard
      question: "For customers with payments, return the customer ID, customer name, the latest payment date in their most recent payment year, and the total amount paid in that year. Order by latest payment date descending."
      groundtruth_sql: |
        SELECT
          c.customerNumber,
          c.customerName,
          MAX(p.paymentDate) AS latest_payment_date_in_latest_year,
          SUM(p.amount) AS total_payment_in_latest_year
        FROM customers AS c
        JOIN (
          SELECT
            customerNumber,
            MAX(YEAR(paymentDate)) AS latest_year
          FROM payments
          GROUP BY customerNumber
        ) AS ly
          ON ly.customerNumber = c.customerNumber
        JOIN payments AS p
          ON p.customerNumber = c.customerNumber
         AND YEAR(p.paymentDate) = ly.latest_year
        GROUP BY c.customerNumber, c.customerName
        ORDER BY MAX(p.paymentDate) DESC;
    - id: H8
      difficulty: hard
      question: "For each product that has been ordered at least once, find the year of its most recent order. Return the product code, product name, that latest order year, and the total quantity ordered for the product in that same year. Order the results by total quantity in the latest year descending, then by product code ascending."
      groundtruth_sql: |
        SELECT
          p.productCode,
          p.productName,
          ly.latest_year AS latest_order_year,
          SUM(od.quantityOrdered) AS total_quantity_in_latest_year
        FROM products AS p
        JOIN (
          SELECT
            od2.productCode,
            MAX(YEAR(o2.orderDate)) AS latest_year
          FROM orderdetails AS od2
          JOIN orders AS o2
            ON o2.orderNumber = od2.orderNumber
          GROUP BY od2.productCode
        ) AS ly
          ON ly.productCode = p.productCode
        JOIN orderdetails AS od
          ON od.productCode = p.productCode
        JOIN orders AS o
          ON o.orderNumber = od.orderNumber
        AND YEAR(o.orderDate) = ly.latest_year
        GROUP BY
          p.productCode,
          p.productName,
          ly.latest_year
        ORDER BY
          total_quantity_in_latest_year DESC,
          p.productCode ASC;
    - id: H9
      difficulty: hard
      question: "Find product lines that have at least one product with MSRP greater than the average MSRP of all products. For each qualifying product line, return the product line name and the number of products in that line that satisfy that MSRP condition. Sort so product lines with more qualifying products appear first; if there is a tie, sort by product line name A-Z."
      groundtruth_sql: |
        SELECT
          pl.productLine,
          COUNT(*) AS product_count
        FROM productlines AS pl
        JOIN products AS p
          ON p.productLine = pl.productLine
        WHERE p.MSRP > (
          SELECT AVG(p2.MSRP)
          FROM products AS p2
        )
        GROUP BY
          pl.productLine
        ORDER BY
          product_count DESC,
          pl.productLine ASC;
    - id: H10
      difficulty: hard
      question: "For each office, return the office code, city, total number of employees, and the number of employees whose job title is 'Sales Rep'. Keep only offices that have at least one Sales Rep and also at least one employee, not necessarily a Sales Rep, who reports to a manager. Order by Sales Rep count descending, then by office code ascending."
      groundtruth_sql: |
        SELECT
          o.officeCode,
          o.city,
          COUNT(e.employeeNumber) AS total_employees,
          SUM(CASE WHEN e.jobTitle = 'Sales Rep' THEN 1 ELSE 0 END) AS sales_rep_count
        FROM offices AS o
        JOIN employees AS e
          ON e.officeCode = o.officeCode
        GROUP BY
          o.officeCode,
          o.city
        HAVING
          SUM(CASE WHEN e.jobTitle = 'Sales Rep' THEN 1 ELSE 0 END) > 0
          AND EXISTS (
            SELECT 1
            FROM employees AS e2
            WHERE e2.officeCode = o.officeCode
              AND e2.reportsTo IS NOT NULL
          )
        ORDER BY
          sales_rep_count DESC,
          o.officeCode ASC;
    - id: H11
      difficulty: hard
      question: "Return customers who have made at least one payment but have never placed any orders. Show customer ID, customer name, and total payment amount. Sort by total payment amount descending, then customer ID ascending."
      groundtruth_sql: |
        SELECT
          c.customerNumber,
          c.customerName,
          SUM(p.amount) AS total_payment_amount
        FROM customers AS c
        JOIN payments AS p
          ON p.customerNumber = c.customerNumber
        LEFT JOIN orders AS o
          ON o.customerNumber = c.customerNumber
        GROUP BY
          c.customerNumber,
          c.customerName
        HAVING
          COUNT(o.orderNumber) = 0
        ORDER BY
          total_payment_amount DESC,
          c.customerNumber ASC;
    - id: H12
      difficulty: hard
      question: "Find offices where the average credit limit of customers assigned to employees in that office is higher than the overall average credit limit across all customers, ignoring NULL credit limits. Return office code, city, and average credit limit. Sort by average credit limit descending, then office code ascending."
      groundtruth_sql: |
        SELECT
          o.officeCode,
          o.city,
          AVG(c.creditLimit) AS avg_credit_limit
        FROM offices AS o
        JOIN employees AS e
          ON e.officeCode = o.officeCode
        JOIN customers AS c
          ON c.salesRepEmployeeNumber = e.employeeNumber
        GROUP BY
          o.officeCode,
          o.city
        HAVING
          AVG(c.creditLimit) > (
            SELECT AVG(c2.creditLimit)
            FROM customers AS c2
            WHERE c2.creditLimit IS NOT NULL
          )
        ORDER BY
          avg_credit_limit DESC,
          o.officeCode ASC;
    - id: H13
      difficulty: hard
      question: "For every employee, including employees who have no customers and customers who have no payments, return the employee ID and full name plus the most recent payment made by any of their customers. Show employee ID, employee name, customer ID, payment date, and amount. If there are multiple payments on that same most recent date, pick the largest amount. Sort by payment date descending, then employee number ascending."
      groundtruth_sql: |
        SELECT
          t.employeeNumber,
          t.employee_name,
          t.customerNumber,
          t.paymentDate,
          t.amount
        FROM (
          SELECT
            e.employeeNumber,
            CONCAT(e.firstName, ' ', e.lastName) AS employee_name,
            c.customerNumber,
            p.paymentDate,
            p.amount,
            ROW_NUMBER() OVER (
              PARTITION BY e.employeeNumber
              ORDER BY p.paymentDate DESC, p.amount DESC, c.customerNumber ASC
            ) AS rn
          FROM employees AS e
          LEFT JOIN customers AS c
            ON c.salesRepEmployeeNumber = e.employeeNumber
          LEFT JOIN payments AS p
            ON p.customerNumber = c.customerNumber
        ) AS t
        WHERE t.rn = 1
        ORDER BY
          t.paymentDate DESC,
          t.employeeNumber ASC;
    - id: H14
      difficulty: hard
      question: "Show customers who have placed at least one order. For each such customer, return customer ID, customer name, total number of orders, total payment amount, and a payment_status flag ('Paid' if total payments > 0 else 'Unpaid'). Sort by total orders descending, then customer ID."
      groundtruth_sql: |
        SELECT
          c.customerNumber,
          c.customerName,
          o.total_orders,
          COALESCE(p.total_payments, 0) AS total_payments,
          CASE
            WHEN COALESCE(p.total_payments, 0) > 0 THEN 'Paid'
            ELSE 'Unpaid'
          END AS payment_status
        FROM customers AS c
        JOIN (
          SELECT
            customerNumber,
            COUNT(*) AS total_orders
          FROM orders
          GROUP BY customerNumber
        ) AS o
          ON o.customerNumber = c.customerNumber
        LEFT JOIN (
          SELECT
            customerNumber,
            SUM(amount) AS total_payments
          FROM payments
          GROUP BY customerNumber
        ) AS p
          ON p.customerNumber = c.customerNumber
        ORDER BY
          o.total_orders DESC,
          c.customerNumber ASC;
    - id: H15
      difficulty: hard
      question: "Find products that were ordered in 2004 but never ordered in 2005. For each such product, return product code, product name, and total quantity ordered in 2004. Sort by total quantity descending, then product code ascending."
      groundtruth_sql: |
        SELECT
          p.productCode,
          p.productName,
          SUM(od.quantityOrdered) AS total_quantity_2004
        FROM products AS p
        JOIN orderdetails AS od
          ON od.productCode = p.productCode
        JOIN orders AS o
          ON o.orderNumber = od.orderNumber
        WHERE YEAR(o.orderDate) = 2004
          AND NOT EXISTS (
            SELECT 1
            FROM orderdetails AS od2
            JOIN orders AS o2
              ON o2.orderNumber = od2.orderNumber
            WHERE od2.productCode = p.productCode
              AND YEAR(o2.orderDate) = 2005
          )
        GROUP BY
          p.productCode,
          p.productName
        ORDER BY
          total_quantity_2004 DESC,
          p.productCode ASC;
    - id: H16
      difficulty: hard
      question: "Show customers who have ordered more than 20 distinct products. Return customer ID, customer name, and the number of distinct products they have ordered. Sort by distinct product count descending, then customer ID ascending."
      groundtruth_sql: |
        SELECT
          c.customerNumber,
          c.customerName,
          COUNT(DISTINCT od.productCode) AS distinct_product_count
        FROM customers AS c
        JOIN orders AS o
          ON o.customerNumber = c.customerNumber
        JOIN orderdetails AS od
          ON od.orderNumber = o.orderNumber
        GROUP BY
          c.customerNumber,
          c.customerName
        HAVING
          COUNT(DISTINCT od.productCode) > 20
        ORDER BY
          distinct_product_count DESC,
          c.customerNumber ASC;
    - id: H17
      difficulty: hard
      question: "Within each product line, return the best-selling product based on total quantity ordered. If multiple products tie on quantity, choose the one with the higher total sales amount calculated using the actual price charged on each order line; if there is still a tie, choose the product with the smaller product code. Return product line, product code, product name, total quantity ordered, and total sales value. Sort by product line ascending."
      groundtruth_sql: |
        SELECT
          ranked.productLine,
          ranked.productCode,
          ranked.productName,
          ranked.total_quantity_ordered,
          ranked.total_sales_value
        FROM (
          SELECT
            p.productLine,
            p.productCode,
            p.productName,
            SUM(od.quantityOrdered) AS total_quantity_ordered,
            SUM(od.quantityOrdered * od.priceEach) AS total_sales_value,
            ROW_NUMBER() OVER (
              PARTITION BY p.productLine
              ORDER BY
                SUM(od.quantityOrdered) DESC,
                SUM(od.quantityOrdered * od.priceEach) DESC,
                p.productCode ASC
            ) AS rn
          FROM products AS p
          JOIN orderdetails AS od
            ON od.productCode = p.productCode
          GROUP BY
            p.productLine,
            p.productCode,
            p.productName
        ) AS ranked
        WHERE ranked.rn = 1
        ORDER BY
          ranked.productLine ASC;
    - id: H18
      difficulty: hard
      question: "For each customer, return the customer number, customer name, payment date, payment amount, and the amount of their next payment ordered by date. If there is no next payment, show NULL. Sort by customer number ascending, then payment date ascending."
      groundtruth_sql: |
        SELECT
          c.customerNumber,
          c.customerName,
          p.paymentDate,
          p.amount,
          LEAD(p.amount) OVER (
            PARTITION BY p.customerNumber
            ORDER BY p.paymentDate ASC
          ) AS next_payment
        FROM customers AS c
        JOIN payments AS p ON p.customerNumber = c.customerNumber
        ORDER BY c.customerNumber ASC, p.paymentDate ASC;
    - id: H19
      difficulty: hard
      question: "For each customer, return the customer number, customer name, payment date, payment amount, and the amount of their previous payment ordered by date. If there is no previous payment, show NULL. Sort by customer number ascending, then payment date ascending."
      groundtruth_sql: |
        SELECT
          c.customerNumber,
          c.customerName,
          p.paymentDate,
          p.amount,
          LAG(p.amount) OVER (
            PARTITION BY p.customerNumber
            ORDER BY p.paymentDate ASC
          ) AS previous_payment
        FROM customers AS c
        JOIN payments AS p ON p.customerNumber = c.customerNumber
        ORDER BY c.customerNumber ASC, p.paymentDate ASC;
    - id: H20
      difficulty: hard
      question: "For every customer, show a running total of payments ordered by payment date. Include all customers even if they have never made any payment. Return the customer number, customer name, payment date, payment amount, and the cumulative total up to and including that payment. Sort by customer number ascending, then payment date ascending."
      groundtruth_sql: |
        SELECT
          c.customerNumber,
          c.customerName,
          p.paymentDate,
          p.amount,
          SUM(p.amount) OVER (
            PARTITION BY p.customerNumber
            ORDER BY p.paymentDate ASC
          ) AS running_total
        FROM customers AS c
        LEFT JOIN payments AS p ON p.customerNumber = c.customerNumber
        ORDER BY c.customerNumber ASC, p.paymentDate ASC;
    - id: H21
      difficulty: hard
      question: "Rank product lines by their total revenue using the actual price charged on each order line. Include only product lines that have at least one ordered product. Return the product line name, total revenue, and the dense rank. Sort by rank ascending."
      groundtruth_sql: |
        SELECT
          p.productLine,
          SUM(od.quantityOrdered * od.priceEach) AS total_revenue,
          DENSE_RANK() OVER (
            ORDER BY SUM(od.quantityOrdered * od.priceEach) DESC
          ) AS revenue_rank
        FROM products AS p
        JOIN orderdetails AS od ON od.productCode = p.productCode
        GROUP BY p.productLine
        ORDER BY revenue_rank ASC;
    - id: H22
      difficulty: hard
      question: "For every product including products that have never been ordered, return the product code, product name, product line, total quantity ordered, and the highest total quantity ordered within the same product line. Sort by product line ascending, then total quantity descending, then product code ascending."
      groundtruth_sql: |
        SELECT
          p.productCode,
          p.productName,
          p.productLine,
          COALESCE(SUM(od.quantityOrdered), 0) AS total_quantity,
          MAX(COALESCE(SUM(od.quantityOrdered), 0)) OVER (
            PARTITION BY p.productLine
          ) AS max_quantity_in_line
        FROM products AS p
        LEFT JOIN orderdetails AS od ON od.productCode = p.productCode
        GROUP BY p.productCode, p.productName, p.productLine
        ORDER BY p.productLine ASC, total_quantity DESC, p.productCode ASC;
    - id: H23
      difficulty: hard
      question: "Return each product whose MSRP is greater than the average MSRP of all other products in the same product line. Show the product code, product name, product line name, product line text description, and MSRP. Sort by product line name ascending, then MSRP descending."
      groundtruth_sql: |
        SELECT
          p.productCode,
          p.productName,
          pl.productLine,
          pl.textDescription,
          p.MSRP
        FROM products AS p
        JOIN productlines AS pl ON pl.productLine = p.productLine
        WHERE p.MSRP > (
          SELECT AVG(p2.MSRP)
          FROM products AS p2
          WHERE p2.productLine = p.productLine
            AND p2.productCode <> p.productCode
        )
        ORDER BY pl.productLine ASC, p.MSRP DESC;
    - id: H24
      difficulty: hard
      question: "Find employees who have no customers assigned to them at all. Return the employee number, first name, last name, and job title. Sort by employee number ascending."
      groundtruth_sql: |
        SELECT
          e.employeeNumber,
          e.firstName,
          e.lastName,
          e.jobTitle
        FROM employees AS e
        LEFT JOIN customers AS c ON c.salesRepEmployeeNumber = e.employeeNumber
        WHERE c.customerNumber IS NULL
        ORDER BY e.employeeNumber ASC;
    - id: H25
      difficulty: hard
      question: "For each employee who reports to another employee, return the subordinate's employee number, full name, and job title, along with their manager's full name, manager's job title, and the city of the office where the subordinate works. Sort by office city ascending, then subordinate employee number ascending."
      groundtruth_sql: |
        SELECT
          e.employeeNumber,
          CONCAT(e.firstName, ' ', e.lastName) AS employee_name,
          e.jobTitle,
          CONCAT(m.firstName, ' ', m.lastName) AS manager_name,
          m.jobTitle AS manager_job_title,
          o.city AS office_city
        FROM employees AS e
        JOIN employees AS m ON m.employeeNumber = e.reportsTo
        JOIN offices AS o ON o.officeCode = e.officeCode
        ORDER BY office_city ASC, e.employeeNumber ASC;
    - id: H26
      difficulty: hard
      question: "Find customers who have placed more than 3 orders and whose average order value exceeds 30000, where average order value is the total revenue across all order lines divided by number of orders. Return the customer number, customer name, total number of orders, and average order value. Sort by average order value descending, then customer number ascending."
      groundtruth_sql: |
        SELECT
          c.customerNumber,
          c.customerName,
          COUNT(DISTINCT o.orderNumber) AS total_orders,
          SUM(od.quantityOrdered * od.priceEach) / COUNT(DISTINCT o.orderNumber) AS avg_order_value
        FROM customers AS c
        JOIN orders AS o ON o.customerNumber = c.customerNumber
        JOIN orderdetails AS od ON od.orderNumber = o.orderNumber
        GROUP BY c.customerNumber, c.customerName
        HAVING
          COUNT(DISTINCT o.orderNumber) > 3
          AND SUM(od.quantityOrdered * od.priceEach) / COUNT(DISTINCT o.orderNumber) > 30000
        ORDER BY avg_order_value DESC, c.customerNumber ASC;
    - id: H27
      difficulty: hard
      question: "Classify all ordered products into three price tiers based on MSRP: 'Budget' if less than 50, 'Mid-range' if between 50 and less than 100, and 'Premium' if 100 or above. For each tier, return the tier label, number of distinct products, total quantity ordered, and average MSRP rounded to 2 decimal places. Sort by average MSRP ascending."
      groundtruth_sql: |
        SELECT
          CASE
            WHEN p.MSRP < 50  THEN 'Budget'
            WHEN p.MSRP < 100 THEN 'Mid-range'
            ELSE 'Premium'
          END AS price_tier,
          COUNT(DISTINCT p.productCode) AS product_count,
          SUM(od.quantityOrdered) AS total_quantity_ordered,
          ROUND(AVG(p.MSRP), 2) AS avg_msrp
        FROM products AS p
        JOIN orderdetails AS od ON od.productCode = p.productCode
        GROUP BY price_tier
        ORDER BY avg_msrp ASC;
    - id: H28
      difficulty: hard
      question: "For each product line, return the product line name, total number of products in that line, and the number of those products that have ever been ordered. Include all product lines even if none of their products have been ordered. Sort by total products descending, then product line ascending."
      groundtruth_sql: |
        SELECT
          pl.productLine,
          COUNT(p.productCode) AS total_products,
          SUM(CASE WHEN od.productCode IS NOT NULL THEN 1 ELSE 0 END) AS ordered_products
        FROM productlines AS pl
        JOIN products AS p ON p.productLine = pl.productLine
        LEFT JOIN (
          SELECT DISTINCT productCode
          FROM orderdetails
        ) AS od ON od.productCode = p.productCode
        GROUP BY pl.productLine
        ORDER BY total_products DESC, pl.productLine ASC;