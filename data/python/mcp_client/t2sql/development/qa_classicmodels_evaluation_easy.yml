cases:
    - id: E1
      difficulty: easy
      question: "Can you list all customers and show only the customer name, sorted from A to Z?"
      groundtruth_sql: |
        SELECT customerName FROM customers ORDER BY customerName;
    - id: E2
      difficulty: easy
      question: "Show customers whose credit limit is at least 100000. Return the customer name and credit limit. Sort by credit limit descending, then by customer name ascending."
      groundtruth_sql: |
        SELECT customerName, creditLimit 
        FROM customers 
        WHERE creditLimit >= 100000 
        ORDER BY creditLimit DESC, customerName ASC;
    - id: E3
      difficulty: easy
      question: "Pull the orders placed between 2003-01-16 and 2003-03-07, and show only the order number."
      groundtruth_sql: |
        SELECT orderNumber
        FROM orders
        WHERE orderDate BETWEEN '2003-01-16' AND '2003-03-07';
    - id: E4
      difficulty: easy
      question: "Show the 5 most expensive products. Include the product code, product name, and listed selling price."
      groundtruth_sql: |
        SELECT productCode, productName, MSRP 
        FROM products 
        ORDER BY MSRP DESC LIMIT 5;
    - id: E5
      difficulty: easy
      question: "Find products with stock below 100 units, and show the product name and quantity in stock."
      groundtruth_sql: |
        SELECT productName, quantityInStock 
        FROM products 
        WHERE quantityInStock < 100;
    - id: E6
      difficulty: easy
      question: "Find product lines where the HTML description is missing, and show the product line name and text descriptions."
      groundtruth_sql: |
        SELECT productLine, textDescription 
        FROM productlines 
        WHERE (htmlDescription IS NULL OR htmlDescription = '');
    - id: E7
      difficulty: easy
      question: "Find products whose names contain Ford. Return the product code and product name."
      groundtruth_sql: |
        SELECT productCode, productName 
        FROM products 
        WHERE productName LIKE '%Ford%';
    - id: E8
      difficulty: easy
      question: "Show customers in France, Germany, or Spain. Return the customer name and country."
      groundtruth_sql: |
        SELECT customerName, country 
        FROM customers 
        WHERE country IN ('France', 'Germany', 'Spain');
    - id: E9
      difficulty: easy
      question: "Show orders with status Shipped. Return the order number, order date, and status."
      groundtruth_sql: |
        SELECT orderNumber, orderDate, status 
        FROM orders 
        WHERE status = 'Shipped';
    - id: E10
      difficulty: easy
      question: "Show orders that have not been shipped yet. Return the order number, order date, and status."
      groundtruth_sql: |
        SELECT orderNumber, orderDate, status 
        FROM orders 
        WHERE shippedDate IS NULL;
    - id: E11
      difficulty: easy
      question: "List offices in the EMEA or APAC territories. Return the office code, city, and territory."
      groundtruth_sql: |
        SELECT officeCode, city, territory 
        FROM offices 
        WHERE territory IN ('EMEA', 'APAC');
    - id: E12
      difficulty: easy
      question: "Show order details where the product code starts with S. Return the order number, product code, quantity ordered, and price per item."
      groundtruth_sql: |
        SELECT orderNumber, productCode, quantityOrdered, priceEach 
        FROM orderdetails 
        WHERE productCode LIKE 'S%';
    - id: E13
      difficulty: easy
      question: "Find employees whose manager employee number is 1143. Return the employee number, first name, last name, and manager employee number."
      groundtruth_sql: |
        SELECT employeeNumber, firstName, lastName, reportsTo 
        FROM employees 
        WHERE reportsTo = 1143;
    - id: E14
      difficulty: easy
      question: "Find payments whose check number has exactly two letters followed by exactly six digits. Return the check number and amount."
      groundtruth_sql: |
        SELECT checkNumber, amount
        FROM payments
        WHERE checkNumber REGEXP '^[A-Z]{2}[0-9]{5}[0-9]$';
    - id: E15
      difficulty: easy
      question: "Show payments made in the first quarter of 2004, meaning January through March. Return the customer number, payment date, and amount."
      groundtruth_sql: |
        SELECT customerNumber, paymentDate, amount 
        FROM payments 
        WHERE YEAR(paymentDate) = 2004 AND MONTH(paymentDate) BETWEEN 1 AND 3;
    - id: E16
      difficulty: easy
      question: "Find order details where the quantity ordered is between 20 and 40 and the product code starts with S. Return the order number, product code, and quantity ordered."
      groundtruth_sql: |
        SELECT orderNumber, productCode, quantityOrdered 
        FROM orderdetails 
        WHERE quantityOrdered BETWEEN 20 AND 40 AND productCode LIKE 'S%';
    - id: E17
      difficulty: easy
      question: "Find offices where the city name has exactly two words. Return the office code and city."
      groundtruth_sql: |
        SELECT officeCode, city 
        FROM offices 
        WHERE city REGEXP '^[A-Za-z]+[[:space:]][A-Za-z]+$';
    - id: E18
      difficulty: easy
      question: "Find employees whose last name contains the letter e but does not end with e. Return the employee number, first name, and last name."
      groundtruth_sql: |
        SELECT employeeNumber, firstName, lastName 
        FROM employees 
        WHERE lastName LIKE '%e%' AND lastName NOT LIKE '%e';
    - id: E19
      difficulty: easy
      question: "Find offices not in the USA, France, or Australia. Return the office code, city, and country."
      groundtruth_sql: |
        SELECT officeCode, city, country 
        FROM offices 
        WHERE country NOT IN ('USA', 'France', 'Australia');
    - id: E20
      difficulty: easy
      question: "Find orders placed on a Friday. Return the order number and order date."
      groundtruth_sql: |
        SELECT orderNumber, orderDate 
        FROM orders 
        WHERE DAYOFWEEK(orderDate) = 6;
    - id: E21
      difficulty: easy
      question: "Show customers in the USA. Return the customer name and city."
      groundtruth_sql: |
        SELECT customerName, city
        FROM customers
        WHERE country = 'USA';
    - id: E22
      difficulty: easy
      question: "Find products with a buy price below 30. Return the product code, product name, and buy price."
      groundtruth_sql: |
        SELECT productCode, productName, buyPrice
        FROM products
        WHERE buyPrice < 30;
    - id: E23
      difficulty: easy
      question: "Show employees with the job title Sales Rep. Return the employee number, first name, last name, and office code."
      groundtruth_sql: |
        SELECT employeeNumber, firstName, lastName, officeCode
        FROM employees
        WHERE jobTitle = 'Sales Rep';
    - id: E24
      difficulty: easy
      question: "Show payments made before 2004-01-01. Return the customer number, payment date, and amount."
      groundtruth_sql: |
        SELECT customerNumber, paymentDate, amount
        FROM payments
        WHERE paymentDate < '2004-01-01';
    - id: E25
      difficulty: easy
      question: "Show orders that have comments. Return the order number, order date, and comments."
      groundtruth_sql: |
        SELECT orderNumber, orderDate, comments
        FROM orders
        WHERE comments IS NOT NULL AND comments <> '';
    - id: E26
      difficulty: easy
      question: "Show offices whose postal code starts with 9. Return the office code, city, country, and postal code."
      groundtruth_sql: |
        SELECT officeCode, city, country, postalCode
        FROM offices
        WHERE postalCode LIKE '9%';
    - id: E27
      difficulty: easy
      question: "Find order details where the quantity ordered is at least 30 and the price per item is above 100. Return the order number, product code, quantity ordered, and price per item."
      groundtruth_sql: |
        SELECT orderNumber, productCode, quantityOrdered, priceEach
        FROM orderdetails
        WHERE quantityOrdered >= 30 AND priceEach > 100;
    - id: E28
      difficulty: easy
      question: "Find product lines whose text description contains the word cars. Return the product line and text description."
      groundtruth_sql: |
        SELECT productLine, textDescription
        FROM productlines
        WHERE textDescription LIKE '%cars%';
    - id: E29
      difficulty: easy
      question: "Find products whose listed selling price is higher than the buy price. Return the product code, product name, buy price, and listed selling price."
      groundtruth_sql: |
        SELECT productCode, productName, buyPrice, MSRP
        FROM products
        WHERE MSRP > buyPrice;
    - id: E30
      difficulty: easy
      question: "Show products from Autoart Studio Design. Return the product code, product name, and product vendor."
      groundtruth_sql: |
        SELECT productCode, productName, productVendor
        FROM products
        WHERE productVendor = 'Autoart Studio Design';
    - id: E31
      difficulty: easy
      question: "Can you list the customers in Japan and show their names and cities, sorted by city?"
      groundtruth_sql: |
        SELECT customerName, city 
        FROM customers 
        WHERE country = 'Japan' 
        ORDER BY city; 
    - id: E32
      difficulty: easy
      question: "Show the 10 products with the highest stock levels. Include the product code, name, and quantity in stock."
      groundtruth_sql: |
        SELECT productCode, productName, quantityInStock 
        FROM products 
        ORDER BY quantityInStock 
        DESC LIMIT 10;
    - id: E33
      difficulty: easy
      question: "Pull all orders placed in 2004 and show the order number and order date, starting from the latest order date."
      groundtruth_sql: |
        SELECT orderNumber, orderDate 
        FROM orders 
        WHERE YEAR(orderDate) = 2004 
        ORDER BY orderDate DESC;
    - id: E34
      difficulty: easy
      question: "Give me all payments above 10,000, along with the customer number, check number, and amount, sorted from highest amount to lowest."
      groundtruth_sql: |
        SELECT customerNumber, checkNumber, amount 
        FROM payments 
        WHERE amount > 10000 
        ORDER BY amount DESC;
    - id: E35
      difficulty: easy
      question: "Find the offices where the state information is missing, and show the office code, city, country, and state."
      groundtruth_sql: |
        SELECT officeCode, city, country, state 
        FROM offices 
        WHERE (state IS NULL OR state = '');
    - id: E36
      difficulty: easy
      question: "Find all products whose names start with '196'. Return the product codes and names."
      groundtruth_sql: |
        SELECT productCode, productName 
        FROM products 
        WHERE productName LIKE '196%';
    - id: E37
      difficulty: easy
      question: "Which employees work in offices 1, 2, or 3? Show the employee number, first name, last name, and office code."
      groundtruth_sql: |
        SELECT employeeNumber, firstName, lastName, officeCode 
        FROM employees 
        WHERE officeCode IN ('1', '2', '3');
    - id: E38
      difficulty: easy
      question: "Find employees whose phone extension starts with 'x' and is followed by exactly three digits. Show the employee number, first name, last name, and extension."
      groundtruth_sql: |
        SELECT employeeNumber, firstName, lastName, extension 
        FROM employees 
        WHERE extension REGEXP '^x[0-9]{3}$';
    - id: E39
      difficulty: easy
      question: "Show orders that are either in status 'Cancelled' or 'On Hold'. Return the order number, order date, and status."
      groundtruth_sql: |
        SELECT orderNumber, orderDate, status 
        FROM orders 
        WHERE status IN('Cancelled','On Hold');
    - id: E40
      difficulty: easy
      question: "I want to see the products with stock between 500 and 1000 units, inclusive. Show the product code, name, and quantity in stock."
      groundtruth_sql: |
        SELECT productCode, productName, quantityInStock 
        FROM products 
        WHERE quantityInStock BETWEEN 500 AND 1000;
    - id: E41
      difficulty: easy
      question: "Which countries do we currently have customers in? Return one row per country, sorted alphabetically."
      groundtruth_sql: |
        SELECT DISTINCT
          country
        FROM customers
        ORDER BY country ASC;
    - id: E42
      difficulty: easy
      question: "Show all offices, and if the state information is missing, display it as 'N/A'. Return office code, city, country, and the displayed state value. Sort by office code ascending."
      groundtruth_sql: |
        SELECT
          officeCode,
          city,
          country,
          COALESCE(state, 'N/A') AS state_display
        FROM offices
        ORDER BY officeCode ASC;
    - id: E43
      difficulty: easy
      question: "Can you show the orders that were shipped after their required date? Return order number, required date, and shipped date. Sort by shipped date descending, then order number ascending."
      groundtruth_sql: |
        SELECT
          orderNumber,
          requiredDate,
          shippedDate
        FROM orders
        WHERE shippedDate > requiredDate
        ORDER BY shippedDate DESC, orderNumber ASC;
    - id: E44
      difficulty: easy
      question: "I need to see which products have a scale of either '1:10' or '1:12'. Please show the product code, name, and scale, and sort by product name descending."
      groundtruth_sql: |
        SELECT
          productCode,
          productName,
          productScale
        FROM products
        WHERE productScale IN ('1:10', '1:12')
        ORDER BY productName DESC;
    - id: E45
      difficulty: easy
      question: "Can you pull the first and last names for all employees? Also, make sure the last names are in all caps and the list is sorted by first name."
      groundtruth_sql: |
        SELECT
          firstName,
          UPPER(lastName) AS lastName
        FROM employees
        ORDER BY firstName;
    - id: E46
      difficulty: easy
      question: "I need to check our profit margins. Can you show the product code, product name, and the difference between MSRP and buy price for each product?"
      groundtruth_sql: |
        SELECT productCode, productName, (MSRP - buyPrice) AS markup
        FROM products;
    - id: E47
      difficulty: easy
      question: "Can you pull all the orders that were placed in the month of May, regardless of the year? Just show the order number and the order date."
      groundtruth_sql: |
        SELECT 
          orderNumber, orderDate
        FROM orders
        WHERE MONTH(orderDate) = 5;
    - id: E48
      difficulty: easy
      question: "Show me the customers who don't have a state listed but are located in either the USA or Canada. I need their name, city, and country."
      groundtruth_sql: |
        SELECT 
          customerName, city, country
        FROM customers
        WHERE state IS NULL AND country IN ('USA', 'Canada');
    - id: E49
      difficulty: easy
      question: "Can you list the product lines where the text description is longer than 200 characters? Show the product line and the first 50 characters of the text description."
      groundtruth_sql: |
        SELECT 
          productLine, LEFT(textDescription, 50) AS description_preview
        FROM productlines
        WHERE LENGTH(textDescription) > 200;
    - id: E50
      difficulty: easy
      question: "Could you list all the orders that haven't been shipped yet or were cancelled? Show the order number, status, and the order date, sorted by status ascending."
      groundtruth_sql: |
        SELECT 
          orderNumber, status, orderDate
        FROM orders
        WHERE status IN ('Cancelled', 'In Process', 'On Hold', 'Disputed') OR shippedDate IS NULL
        ORDER BY status;