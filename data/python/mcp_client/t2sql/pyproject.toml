[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t2sql-rag"
version = "0.1.0"
description = "RAG-based Text-to-SQL system with adaptive multi-model LLMs, multi-agent refinement, and DataHub-style metadata."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jovian Aditya Wiranata" }]

dependencies = [
  "fastmcp>=0.9.1",
  "python-dotenv>=1.0.1",
  "requests>=2.31.0",
  "tabulate>=0.9.0",
  "rank-bm25>=0.2.2",
  "scikit-learn>=1.3.0",
  "chromadb>=0.5.0",
  "langgraph>=0.2.0",
  "langchain-ollama>=0.2.0",
  "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "pytest>=8.0.0",
  "ipykernel>=6.29.0",
  "notebook>=7.2.0",
]

[project.scripts]
t2sql-rag = "t2sql_rag.cli:main"

# -------------------------
# setuptools packaging
# Best practice: src-layout
# -------------------------
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# -------------------------
# tooling (optional)
# -------------------------
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]