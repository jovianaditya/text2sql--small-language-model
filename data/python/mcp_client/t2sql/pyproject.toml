[build-system]
requires = ["setuptools==79.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "t2sql-rag"
version = "0.1.0"
description = "RAG-based Text-to-SQL system with adaptive multi-model LLMs, multi-agent refinement, and DataHub-style metadata."
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [{ name = "Jovian Aditya Wiranata" }]

dependencies = [
  "fastmcp==3.4.4",
  "python-dotenv==1.2.2",
  "requests==2.34.2",
  "tabulate==0.10.0",
  "rank-bm25==0.2.2",
  "scikit-learn==1.7.2",
  "chromadb==1.5.9",
  "langgraph==1.2.9",
  "langchain-ollama==1.1.0",
  "sqlglot==30.12.0",
  "streamlit==1.59.2",
  "pandas==2.3.3",
  "PyYAML==6.0.3",
  "nest-asyncio==1.6.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.15.21",
  "pytest==9.1.1",
  "ipykernel==7.3.0",
  "notebook==7.6.0",
]
evaluation = [
  "httpx==0.28.1",
  "openpyxl==3.1.5",
]

[project.scripts]
t2sql-rag = "t2sql.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["t2sql*"]

# -------------------------
# tooling (optional)
# -------------------------
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
