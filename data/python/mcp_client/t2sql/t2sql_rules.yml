    - "\\bfrom\\s+(the\\s+)?(highest|lowest|latest|earliest|newest|oldest)"
    - "\\bfrom\\s+(a\\s+to\\s+z|z\\s+to\\s+a)"
    - "\\b(sorted|ordered)\\s+from\\b"
    - "\\b(?:start|starting|begin|beginning)\\s+(?:with|from)\\s+(?:the\\s+)?(?:highest|lowest|latest|earliest|newest|oldest|most\\s+recent|least\\s+recent)"
    - "\\b(?:most\\s+recent|least\\s+recent|latest|earliest|newest|oldest)\\s+first\\b"
    - "\\b(?:largest|highest|greatest|biggest|lowest|smallest|least)\\b[^.]{0,48}\\b(?:at|on)\\s+the\\s+(?:top|bottom)\\b"
    - "\\bsort\\s+from\\b"
    - "\\b(?:order|sort|arrange)(?:ed)?\\s+(?:the\\s+)?(?:[a-z0-9_-]+\\s+){0,6}chronologically\\b"
    - "\\bin\\s+chronological\\s+order\\b"
