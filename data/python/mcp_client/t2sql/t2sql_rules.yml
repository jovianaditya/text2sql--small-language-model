schema_version: 1
profile: default
description: >
  Centralized intent lexicon and heuristic rules for Text-to-SQL behavior.
  This file is consumed by runtime rulebook helpers.

meta:
  owners:
    - t2sql
  locales:
    - en
    - id

matching:
