    - "\\brow[_\\s]?number\\b[^.]{0,96}\\bby\\b[^.]{0,64}\\b(?:ascending|descending|asc|desc)\\b"
    - "\\bdense[_\\s]?rank\\b[^.]{0,96}\\bby\\b[^.]{0,64}\\b(?:ascending|descending|asc|desc)\\b"
