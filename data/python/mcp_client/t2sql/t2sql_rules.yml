schema_version: 1
profile: default
description: >
  Centralized intent lexicon and heuristic rules for Text-to-SQL behavior.
  This file is consumed by runtime rulebook helpers.

meta:
  owners:
    - t2sql
  locales:
    - en
    - id

matching:
  case_sensitive: false
  normalize:
    lowercase: true
    collapse_whitespace: true
    trim: true
  regex:
    enabled: true
    default_flags:
      - IGNORECASE

name_intent:
  split_components:
    require_any:
      - name
      - names
      - nama
    require_group_1:
      - first
      - given
      - forename
      - depan
    require_group_2:
      - last
      - family
      - surname
      - belakang
    forbid_phrases:
      - full name
      - complete name
      - nama lengkap
  combined_full_name:
    any_phrases:
      - full name
      - complete name
      - nama lengkap
    require_any:
      - name
      - names
      - nama
    any_verbs:
      - combine
      - combined
      - combining
      - concatenate
      - concatenated
      - concatenating
      - concat
      - join
      - joined
      - joining
      - gabung
      - gabungkan
    verb_name_window_chars: 48
  name_component_column_hints:
    lexical_tokens:
      - name
      - fullname
      - full_name
      - first
      - last
      - given
      - family
      - surname
      - forename
      - middle
    synonym_hints:
      - full name
      - first name
      - last name
      - given name
      - family name
      - surname
    ordering_priority:
      first:
        - first
        - firstname
        - given
        - givenname
        - forename
        - depan
        - nama_depan
      middle:
        - middle
        - middlename
        - tengah
      last:
        - last
        - lastname
        - family
        - familyname
        - surname
        - belakang
        - nama_belakang
      generic:
        - name
        - fullname
        - full_name

