schema_version: 1
profile: default
description: >
  Centralized intent lexicon and heuristic rules for Text-to-SQL behavior.
  This file is consumed by runtime rulebook helpers.

meta:
  owners:
    - t2sql
  locales:
    - en
    - id

matching:
  case_sensitive: false
  normalize:
    lowercase: true
    collapse_whitespace: true
    trim: true
  regex:
    enabled: true
    default_flags:
      - IGNORECASE

name_intent:
  split_components:
    require_any:
      - name
      - names
      - nama
    require_group_1:
      - first
      - given
      - forename
      - depan
    require_group_2:
      - last
      - family
      - surname
      - belakang
    forbid_phrases:
      - full name
      - complete name
      - nama lengkap
  combined_full_name:
    any_phrases:
      - full name
      - complete name
      - nama lengkap
    require_any:
      - name
      - names
      - nama
    any_verbs:
      - combine
      - combined
      - combining
      - concatenate
      - concatenated
      - concatenating
      - concat
      - join
      - joined
      - joining
      - gabung
      - gabungkan
    verb_name_window_chars: 48
  name_component_column_hints:
    lexical_tokens:
      - name
      - fullname
      - full_name
      - first
      - last
      - given
      - family
      - surname
      - forename
      - middle
    synonym_hints:
      - full name
      - first name
      - last name
      - given name
      - family name
      - surname
    ordering_priority:
      first:
        - first
        - firstname
        - given
        - givenname
        - forename
        - depan
        - nama_depan
      middle:
        - middle
        - middlename
        - tengah
      last:
        - last
        - lastname
        - family
        - familyname
        - surname
        - belakang
        - nama_belakang
      generic:
        - name
        - fullname
        - full_name

identifier_intent:
  id_like_terms:
    - id
    - ids
    - identifier
    - identifiers
    - code
    - codes
    - number
    - numbers
    - nomor
    - nomors
    - no
    - kode
  id_column_suffix_hints:
    - id
    - code
    - number

retrieval_intent:
  extra_stopwords:
    - show
    - all
    - list
    - their
    - that
    - have
    - no
    - include
    - includes
    - including
    - sort
    - sorted
    - sorting
    - result
    - results
    - record
    - records
    - row
    - rows
    - display
    - return
    - get
    - give
    - find
    - fetch
    - please
    - kindly
    - alphabetical
    - alphabetically
    - alphabetized
    - alphabetize
    - reverse alphabetical
    - reversed alphabetical
    - reverse
    - ascending
    - descending
    - distinct
    - yang
    - dan
    - atau
    - ke
    - dari
    - di
    - itu
    - ini
    - tampilkan
    - daftar
  generic_mention_terms:
    - name
    - names
    - id
    - ids
    - code
    - codes
    - number
    - numbers
    - date
    - dates
    - time
    - status
    - type
    - types
    - value
    - values
    - amount
    - amounts
    - total
    - totals
    - count
    - counts
    - description
    - descriptions
    - detail
    - details
    - record
    - records
    - row
    - rows
    - address
    - city
    - country
    - state
    - phone
    - email
    - contact
  join_signals:
    - join
    - gabung
    - combine
    - combine with
    - along with
    - together with
    - and their
    - with their
    - beserta
    - bersama
    - dengan
    - for each
    - "per "
    - setiap

ordering_intent:
  explicit_sort_keywords:
    - order by
    - sort by
    - sorted by
    - ordered by
    - arrange by
    - urut berdasarkan
    - urutkan berdasarkan
    - diurutkan berdasarkan
  direction_keywords:
    asc:
      - asc
      - ascending
      - menaik
    desc:
      - desc
      - descending
      - menurun
  superlative_keywords:
    - top
    - bottom
    - highest
    - lowest
    - largest
    - smallest
    - newest
    - latest
    - earliest
    - oldest
    - terbesar
    - terkecil
    - tertinggi
    - terendah
    - terbaru
    - terlama
  window_context_regex:
    - "\\brank\\b.*\\b(ascending|descending)\\s+order\\b"
    - "\\brow[_\\s]?number\\b.*\\b(ascending|descending)\\s+order\\b"
    - "\\bdense[_\\s]?rank\\b.*\\b(ascending|descending)\\s+order\\b"
    - "\\bpartition\\s+by\\b.*\\b(ascending|descending)\\b"
    - "\\bbased\\s+on\\b.*\\b(ascending|descending)\\s+order\\b"
    - "\\b(cumulative|running)\\b.*\\bordered\\s+by\\b"
    - "\\b(second|third|fourth|fifth|\\d+(?:st|nd|rd|th))\\b.*\\b(sorted|ordered)\\s+by\\b"
    - "\\b(sorted|ordered)\\s+by\\b.*\\b(second|third|fourth|fifth|\\d+(?:st|nd|rd|th))\\b"
  ordering_phrase_regex:
    - "\\bfrom\\s+(the\\s+)?(highest|lowest|latest|earliest|newest|oldest)"
    - "\\bfrom\\s+(a\\s+to\\s+z|z\\s+to\\s+a)"
    - "\\b(sorted|ordered)\\s+from\\b"

grouping_intent:
  for_each_keywords:
    - for each
    - each
    - per
    - every
    - tiap
    - setiap
  aggregate_keywords:
    - sum
    - total
    - count
    - avg
    - average
    - min
    - max
    - jumlah
    - rata-rata

set_operation_intent:
  set_op_keywords:
    - union
    - union all
    - combine results
    - gabungkan hasil
  distinct_union_cues:
    - remove duplicate rows
    - without duplicates
    - no duplicate
    - distinct
  branch_label_hints:
    - label
    - year label
    - category label

regex_intent:
  boundary_cues:
    - whole word
    - exact word
    - word boundary
  structural_cues:
    - exactly
    - exact pattern
    - regex
    - regexp
    - rlike

temporal_intent:
  latest_keywords:
    - latest
    - newest
    - most recent
    - terakhir
    - terbaru
  earliest_keywords:
    - earliest
    - oldest
    - pertama
    - terlama
  year_scope_keywords:
    - latest year
    - most recent year
    - tahun terbaru
    - tahun terakhir

ranking_intent:
  ranking_keywords:
    - rank
    - ranking
    - row_number
    - dense_rank
    - top
    - bottom
    - peringkat
  winner_row_keywords:
    - most recent per
    - highest per
    - largest per
    - latest per

exclusion_intent:
  negative_keywords:
    - not
    - no
    - without
    - exclude
    - excluding
    - except
    - selain
    - tanpa

include_zero_intent:
  include_zero_keywords:
    - including zero
    - include zero
    - even if none
    - even when none
    - termasuk yang tidak punya
    - termasuk nol

aggregation_intent:
  count_distinct_keywords:
    - distinct
    - unique
    - different
    - unik
    - berbeda
  count_distinct_phrases:
    - how many distinct
    - number of unique
    - jumlah unik

precedence:
  - name_intent.combined_full_name
  - name_intent.split_components
  - grouping_intent.for_each_keywords
  - set_operation_intent.set_op_keywords
  - ranking_intent.ranking_keywords
  - temporal_intent.latest_keywords

actions:
  name_intent.combined_full_name:
    output_shape: combined_name
    allow_concat: true
  name_intent.split_components:
    output_shape: split_name_columns
    allow_concat: false
