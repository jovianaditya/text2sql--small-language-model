cases:
    - id: E1
      difficulty: easy
      question: "Show the customer named Royale Belge. Return the customer name and postal code, sorted by customer name ascending and country descending."
      groundtruth_sql: "SELECT customerName, postalCode FROM customers WHERE customerName = 'Royale Belge' ORDER BY customerName ASC, country DESC;"
    - id: E2
      difficulty: easy
      question: "Show customers whose contact last name starts with S. Return the customer name, contact first name, and contact last name."
      groundtruth_sql: |
        SELECT customerName, contactFirstName, contactLastName
        FROM customers
        WHERE contactLastName LIKE 'S%';
    - id: E3
      difficulty: easy
      question: "Show customers whose postal code starts with 2. Return the customer name, city, country, and postal code, sorted by postal code ascending."
      groundtruth_sql: |
        SELECT customerName, city, country, postalCode
        FROM customers
        WHERE postalCode LIKE '2%'
        ORDER BY postalCode ASC;
    - id: E4
      difficulty: easy
      question: "Show customers in Norway or Sweden. Return the customer name, city, country, postal code, and phone."
      groundtruth_sql: |
        SELECT customerName, city, country, postalCode, phone
        FROM customers
        WHERE country IN ('Norway', 'Sweden');
    - id: E5
      difficulty: easy
      question: "Find products where the quantity in stock is greater than 5000. Return the product code, product name, quantity in stock, and product vendor, sorted by quantity in stock descending."
      groundtruth_sql: |
        SELECT productCode, productName, quantityInStock, productVendor
        FROM products
        WHERE quantityInStock > 5000
        ORDER BY quantityInStock DESC;
    - id: E6
      difficulty: easy
      question: "Show products whose product scale is 1:18. Return the product code, product name, product scale, and product line, sorted by product name ascending."
      groundtruth_sql: |
        SELECT productCode, productName, productScale, productLine
        FROM products
        WHERE productScale = '1:18'
        ORDER BY productName ASC;
    - id: E7
      difficulty: easy
      question: "Show products with a listed price between 80 and 120, inclusive. Return the product code, product name, buy price, and listed price."
      groundtruth_sql: |
        SELECT productCode, productName, buyPrice, MSRP
        FROM products
        WHERE MSRP BETWEEN 80 AND 120;
    - id: E8
      difficulty: easy
      question: "Show employees who do not report to anyone. Return the employee number, first name, last name, and manager employee number, sorted by employee number ascending."
      groundtruth_sql: |
        SELECT employeeNumber, firstName, lastName, reportsTo
        FROM employees
        WHERE reportsTo IS NULL
        ORDER BY employeeNumber ASC;
    - id: E9
      difficulty: easy
      question: "Find employees working in office 4 whose last name starts with M. Return the employee number, first name, last name, and office code, sorted by last name ascending."
      groundtruth_sql: |
        SELECT employeeNumber, firstName, lastName, officeCode
        FROM employees
        WHERE officeCode = '4' AND lastName LIKE 'M%'
        ORDER BY lastName ASC;
    - id: E10
      difficulty: easy
      question: "Show employees whose phone extension ends with 8. Return the employee number, first name, last name, and extension, sorted by extension ascending."
      groundtruth_sql: |
        SELECT employeeNumber, firstName, lastName, extension
        FROM employees
        WHERE extension LIKE '%8'
        ORDER BY extension ASC;
    - id: E11
      difficulty: easy
      question: "Find employees whose phone extension starts with x6. Return the employee number, first name, last name, and extension, sorted by extension ascending."
      groundtruth_sql: |
        SELECT employeeNumber, firstName, lastName, extension
        FROM employees
        WHERE extension LIKE 'x6%'
        ORDER BY extension ASC;
    - id: E12
      difficulty: easy
      question: "Show offices in the USA or Japan. Return the office code, city, country, and territory. Sort by country ascending, then by city ascending."
      groundtruth_sql: |
        SELECT officeCode, city, country, territory
        FROM offices
        WHERE country IN ('USA', 'Japan')
        ORDER BY country ASC, city ASC;
    - id: E13
      difficulty: easy
      question: "Find offices that do not have a second address line listed. Return the office code, city, country, and the second address line."
      groundtruth_sql: |
        SELECT officeCode, city, country, addressLine2
        FROM offices
        WHERE addressLine2 IS NULL OR addressLine2 = '';
    - id: E14
      difficulty: easy
      question: "Show offices whose phone number starts with +1. Return the office code, city, country, and phone."
      groundtruth_sql: |
        SELECT officeCode, city, country, phone
        FROM offices
        WHERE phone LIKE '+1 %';
    - id: E15
      difficulty: easy
      question: "Find offices whose city contains the letter o. Return the office code, city, and country, sorted by city ascending."
      groundtruth_sql: |
        SELECT officeCode, city, country
        FROM offices
        WHERE city LIKE '%o%'
        ORDER BY city ASC;
    - id: E16
      difficulty: easy
      question: "Find order details whose order number is between 10200 and 10250. Return the order number, product code, quantity ordered, and order line number, sorted by order number ascending."
      groundtruth_sql: |
        SELECT orderNumber, productCode, quantityOrdered, orderLineNumber
        FROM orderdetails
        WHERE orderNumber BETWEEN 10200 AND 10250
        ORDER BY orderNumber ASC;
    - id: E17
      difficulty: easy
      question: "Show order details where the price per item is greater than the quantity ordered. Return the order number, product code, quantity ordered, and price per item, sorted by order number ascending."
      groundtruth_sql: |
        SELECT orderNumber, productCode, quantityOrdered, priceEach
        FROM orderdetails
        WHERE priceEach > quantityOrdered
        ORDER BY orderNumber ASC;
    - id: E18
      difficulty: easy
      question: "Show order details whose line number is 1. Return the order number, product code, order line number, and quantity ordered, sorted by order number ascending."
      groundtruth_sql: |
        SELECT orderNumber, productCode, orderLineNumber, quantityOrdered
        FROM orderdetails
        WHERE orderLineNumber = 1
        ORDER BY orderNumber ASC;
    - id: E19
      difficulty: easy
      question: "Find order details where the price per item is greater than 150. Return the order number, product code, quantity ordered, and price per item, sorted by price per item descending."
      groundtruth_sql: |
        SELECT orderNumber, productCode, quantityOrdered, priceEach
        FROM orderdetails
        WHERE priceEach > 150
        ORDER BY priceEach DESC;
    - id: E20
      difficulty: easy
      question: "Find orders placed after 2004-06-01. Return the order number, order date, and status, sorted by order date descending."
      groundtruth_sql: |
        SELECT orderNumber, orderDate, status
        FROM orders
        WHERE orderDate > '2004-06-01'
        ORDER BY orderDate DESC;
    - id: E21
      difficulty: easy
      question: "Show orders whose comments contain the word Customer. Return the order number, order date, and comments."
      groundtruth_sql: |
        SELECT orderNumber, orderDate, comments
        FROM orders
        WHERE comments LIKE '%Customer%';
    - id: E22
      difficulty: easy
      question: "Find orders whose required date is after 2004-12-01. Return the order number, required date, and status, sorted by required date ascending."
      groundtruth_sql: |
        SELECT orderNumber, requiredDate, status
        FROM orders
        WHERE requiredDate > '2004-12-01'
        ORDER BY requiredDate ASC;
    - id: E23
      difficulty: easy
      question: "Find orders that do not have any comments listed. Return the order number, order date, and status, sorted by order date ascending."
      groundtruth_sql: |
        SELECT orderNumber, orderDate, status
        FROM orders
        WHERE comments IS NULL OR comments = ''
        ORDER BY orderDate ASC;
    - id: E24
      difficulty: easy
      question: "Show payments whose check number ends with 6. Return the customer number, check number, and amount, sorted by check number ascending."
      groundtruth_sql: |
        SELECT customerNumber, checkNumber, amount
        FROM payments
        WHERE checkNumber LIKE '%6'
        ORDER BY checkNumber ASC;
    - id: E25
      difficulty: easy
      question: "Find payments whose check number starts with H. Return the customer number, check number, and amount."
      groundtruth_sql: |
        SELECT customerNumber, checkNumber, amount
        FROM payments
        WHERE checkNumber LIKE 'H%';
    - id: E26
      difficulty: easy
      question: "Show payments made in 2003. Return the customer number, payment date, and amount, sorted by payment date ascending."
      groundtruth_sql: |
        SELECT customerNumber, paymentDate, amount
        FROM payments
        WHERE YEAR(paymentDate) = 2003
        ORDER BY paymentDate ASC;
    - id: E27
      difficulty: easy
      question: "Find payments made after 2004-09-01 where the amount is below 10000. Return the customer number, payment date, and amount, sorted by payment date descending."
      groundtruth_sql: |
        SELECT customerNumber, paymentDate, amount
        FROM payments
        WHERE paymentDate > '2004-09-01' AND amount < 10000
        ORDER BY paymentDate DESC;
    - id: E28
      difficulty: easy
      question: "Show product lines whose names end with Cars. Return the product line and text description, sorted by product line ascending."
      groundtruth_sql: |
        SELECT productLine, textDescription
        FROM productlines
        WHERE productLine LIKE '%Cars'
        ORDER BY productLine ASC;
    - id: E29
      difficulty: easy
      question: "Find product lines whose names are longer than 10 characters. Return the product line and text description, sorted by product line ascending."
      groundtruth_sql: |
        SELECT productLine, textDescription
        FROM productlines
        WHERE LENGTH(productLine) > 10
        ORDER BY productLine ASC;
    - id: E30
      difficulty: easy
      question: "Show product lines whose names start with T. Return the product line and text description."
      groundtruth_sql: |
        SELECT productLine, textDescription
        FROM productlines
        WHERE productLine LIKE 'T%';
      
