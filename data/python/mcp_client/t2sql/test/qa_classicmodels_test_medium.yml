cases:
    - id: M1
      difficulty: medium
      question: "Group customers into two account-manager buckets: Assigned when a sales rep employee number is present and Unassigned when it is missing. Return the bucket, customer count, and average credit limit. Sort by customer count descending, then bucket ascending."
      groundtruth_sql: |
        SELECT CASE
                   WHEN salesRepEmployeeNumber IS NULL THEN 'Unassigned'
                   ELSE 'Assigned'
               END AS account_manager_bucket,
               COUNT(*) AS customer_count,
               AVG(creditLimit) AS average_credit_limit
        FROM customers
        GROUP BY CASE
                     WHEN salesRepEmployeeNumber IS NULL THEN 'Unassigned'
                     ELSE 'Assigned'
                 END
        ORDER BY customer_count DESC, account_manager_bucket ASC;
    - id: M2
      difficulty: medium
      question: "For each customer, return the customer number, customer name, country, and how many customers are in that same country. Sort by country ascending, then customer number ascending."
      groundtruth_sql: |
        SELECT customerNumber,
               customerName,
               country,
               COUNT(*) OVER (
                   PARTITION BY country
               ) AS customers_in_same_country
        FROM customers
        ORDER BY country ASC, customerNumber ASC;
    - id: M3
      difficulty: medium
      question: "By country, return the country, total customers, and how many distinct sales reps serve those customers. Keep only countries that have at least 2 distinct sales reps. Sort by distinct sales rep count descending, then country ascending."
      groundtruth_sql: |
        SELECT country,
               COUNT(*) AS customer_count,
               COUNT(DISTINCT salesRepEmployeeNumber) AS distinct_sales_rep_count
        FROM customers
        GROUP BY country
        HAVING COUNT(DISTINCT salesRepEmployeeNumber) >= 2
        ORDER BY distinct_sales_rep_count DESC, country ASC;
    - id: M4
      difficulty: medium
      question: "Show customers whose credit limit is above the average credit limit in the same country. Return the customer number, customer name, country, and credit limit. Sort by country ascending, then credit limit descending, then customer number ascending."
      groundtruth_sql: |
        SELECT customerNumber, customerName, country, creditLimit
        FROM customers c
        WHERE creditLimit IS NOT NULL
          AND creditLimit > (
              SELECT AVG(c2.creditLimit)
              FROM customers c2
              WHERE c2.country = c.country
                AND c2.creditLimit IS NOT NULL
          )
        ORDER BY country ASC, creditLimit DESC, customerNumber ASC;
    - id: M5
      difficulty: medium
      question: "Inside each office, look ahead to the next employee number after sorting employees from lowest to highest employee number. Return the office code, employee number, first name, last name, and the next employee number in that office. Sort by office code, then employee number ascending."
      groundtruth_sql: |
        SELECT officeCode,
               employeeNumber,
               firstName,
               lastName,
               LEAD(employeeNumber) OVER (
                   PARTITION BY officeCode
                   ORDER BY employeeNumber ASC
               ) AS next_employee_number
        FROM employees
        ORDER BY officeCode ASC, employeeNumber ASC;
    - id: M6
      difficulty: medium
      question: "Group employees by the first letter of last name. Return the last-name initial, employee count, and highest employee number. Keep only initials with at least 2 employees. Sort by employee count descending, then initial ascending."
      groundtruth_sql: |
        SELECT LEFT(lastName, 1) AS last_name_initial,
               COUNT(*) AS employee_count,
               MAX(employeeNumber) AS highest_employee_number
        FROM employees
        GROUP BY LEFT(lastName, 1)
        HAVING COUNT(*) >= 2
        ORDER BY employee_count DESC, last_name_initial ASC;
    - id: M7
      difficulty: medium
      question: "Inside each office, rank employees by employee number from lowest to highest. Return the employee number, office code, first name, last name, and that rank. Final output should be ordered by office code, then rank, then employee number."
      groundtruth_sql: |
        SELECT employeeNumber,
               officeCode,
               firstName,
               lastName,
               RANK() OVER (PARTITION BY officeCode ORDER BY employeeNumber ASC) AS employee_rank
        FROM employees
        ORDER BY officeCode ASC, employee_rank ASC, employeeNumber ASC;
    - id: M8
      difficulty: medium
      question: "Inside each job title, return the employee number, job title, and the previous employee number in that title when rows are sorted from lowest to highest employee number. Sort by job title ascending, then employee number ascending."
      groundtruth_sql: |
        SELECT employeeNumber,
               jobTitle,
               LAG(employeeNumber) OVER (
                   PARTITION BY jobTitle
                   ORDER BY employeeNumber ASC
               ) AS previous_employee_number
        FROM employees
        ORDER BY jobTitle ASC, employeeNumber ASC;
    - id: M9
      difficulty: medium
      question: "Group offices by the first 3 characters of the phone number. Return the phone prefix, office count, and how many distinct countries appear in that prefix group. Keep only prefixes that cover at least 2 distinct countries. Sort by office count descending, then phone prefix ascending."
      groundtruth_sql: |
        SELECT SUBSTRING(phone, 1, 3) AS phone_prefix,
               COUNT(*) AS office_count,
               COUNT(DISTINCT country) AS distinct_country_count
        FROM offices
        GROUP BY SUBSTRING(phone, 1, 3)
        HAVING COUNT(DISTINCT country) >= 2
        ORDER BY office_count DESC, phone_prefix ASC;
    - id: M10
      difficulty: medium
      question: "Group offices by territory. Return the territory, office count, and the highest office code. Keep only territories that appear in at least 2 different countries. Sort by office count descending, then territory ascending."
      groundtruth_sql: |
        SELECT territory,
               COUNT(*) AS office_count,
               MAX(officeCode) AS highest_office_code
        FROM offices
        GROUP BY territory
        HAVING COUNT(DISTINCT country) >= 2
        ORDER BY office_count DESC, territory ASC;
    - id: M11
      difficulty: medium
      question: "Within each country, rank offices by office code from lowest to highest. Return the office code, city, country, and that rank. Sort the final result by country, then rank, then office code."
      groundtruth_sql: |
        SELECT officeCode,
               city,
               country,
               RANK() OVER (PARTITION BY country ORDER BY officeCode ASC) AS office_rank
        FROM offices
        ORDER BY country ASC, office_rank ASC, officeCode ASC;
    - id: M12
      difficulty: medium
      question: "Group order detail rows by order number. Return the order number, line count, total quantity ordered, and highest price per item. Keep only orders that have at least 3 lines. Sort by total quantity ordered descending, then order number ascending."
      groundtruth_sql: |
        SELECT orderNumber,
               COUNT(*) AS line_count,
               SUM(quantityOrdered) AS total_quantity_ordered,
               MAX(priceEach) AS highest_price_each
        FROM orderdetails
        GROUP BY orderNumber
        HAVING COUNT(*) >= 3
        ORDER BY total_quantity_ordered DESC, orderNumber ASC;
    - id: M13
      difficulty: medium
      question: "Inside each product code in order details, number the rows after sorting price per item from highest to lowest. Break ties with the smaller order number first. Return the product code, order number, line number, price per item, and that position. Sort by product code, then position, then order number."
      groundtruth_sql: |
        SELECT productCode,
               orderNumber,
               orderLineNumber,
               priceEach,
               ROW_NUMBER() OVER (
                   PARTITION BY productCode
                   ORDER BY priceEach DESC, orderNumber ASC
               ) AS price_position_within_product
        FROM orderdetails
        ORDER BY productCode ASC, price_position_within_product ASC, orderNumber ASC;
    - id: M14
      difficulty: medium
      question: "Within each product code in order details, compute a running total of quantity ordered after sorting by order number and then line number. Return the product code, order number, line number, quantity ordered, and the running quantity total. Sort by product code, then order number, then line number."
      groundtruth_sql: |
        SELECT productCode,
               orderNumber,
               orderLineNumber,
               quantityOrdered,
               SUM(quantityOrdered) OVER (
                   PARTITION BY productCode
                   ORDER BY orderNumber ASC, orderLineNumber ASC
               ) AS running_quantity_total
        FROM orderdetails
        ORDER BY productCode ASC, orderNumber ASC, orderLineNumber ASC;
    - id: M15
      difficulty: medium
      question: "For each product code in order details, return the product code, total quantity ordered, average price per item, and line count. Keep only products whose average price per item is above 100. Sort by average price per item descending, then product code."
      groundtruth_sql: |
        SELECT productCode,
               SUM(quantityOrdered) AS total_quantity_ordered,
               AVG(priceEach) AS average_price_each,
               COUNT(*) AS line_count
        FROM orderdetails
        GROUP BY productCode
        HAVING AVG(priceEach) > 100
        ORDER BY average_price_each DESC, productCode ASC;
    - id: M16
      difficulty: medium
      question: "Group orders by status. Return the status, total orders, the average number of days between order date and required date, and the latest required date. Keep only statuses whose average required-gap is above 20 days. Sort by average required-gap days descending, then status ascending."
      groundtruth_sql: |
        SELECT status,
               COUNT(*) AS total_orders,
               AVG(DATEDIFF(requiredDate, orderDate)) AS average_required_gap_days,
               MAX(requiredDate) AS latest_required_date
        FROM orders
        GROUP BY status
        HAVING AVG(DATEDIFF(requiredDate, orderDate)) > 20
        ORDER BY average_required_gap_days DESC, status ASC;
    - id: M17
      difficulty: medium
      question: "Create one order list by appending two result sets. First include orders with status Shipped, then include orders that have comments filled in. Keep duplicate rows if an order appears in both result sets. Return order number, status, order date, and source label. Sort by order number ascending, then source label ascending."
      groundtruth_sql: |
        SELECT orderNumber,
               status,
               orderDate,
               'shipped' AS source_label
        FROM orders
        WHERE status = 'Shipped'
        UNION ALL
        SELECT orderNumber,
               status,
               orderDate,
               'commented' AS source_label
        FROM orders
        WHERE comments IS NOT NULL AND comments <> ''
        ORDER BY orderNumber ASC, source_label ASC;
    - id: M18
      difficulty: medium
      question: "For each customer in orders, number the orders from earliest to latest order date. Break ties with the smaller order number first. Return the customer number, order number, order date, status, and that position. Sort by customer number, then position, then order number."
      groundtruth_sql: |
        SELECT customerNumber,
               orderNumber,
               orderDate,
               status,
               ROW_NUMBER() OVER (
                   PARTITION BY customerNumber
                   ORDER BY orderDate ASC, orderNumber ASC
               ) AS order_position
        FROM orders
        ORDER BY customerNumber ASC, order_position ASC, orderNumber ASC;
    - id: M19
      difficulty: medium
      question: "For each order, return the order number, customer number, status, and how many orders that customer has in total. Sort by customer number ascending, then order number ascending."
      groundtruth_sql: |
        SELECT orderNumber,
               customerNumber,
               status,
               COUNT(*) OVER (
                   PARTITION BY customerNumber
               ) AS total_orders_for_customer
        FROM orders
        ORDER BY customerNumber ASC, orderNumber ASC;
    - id: M20
      difficulty: medium
      question: "Group payments into three amount bands: Small when amount is below 25000, Medium when amount is from 25000 up to 50000, and Large when amount is above 50000. Return the amount band, payment count, and total amount. Order by total amount descending, then amount band ascending."
      groundtruth_sql: |
        SELECT CASE
                   WHEN amount < 25000 THEN 'Small'
                   WHEN amount <= 50000 THEN 'Medium'
                   ELSE 'Large'
               END AS amount_band,
               COUNT(*) AS payment_count,
               SUM(amount) AS total_amount
        FROM payments
        GROUP BY CASE
                     WHEN amount < 25000 THEN 'Small'
                     WHEN amount <= 50000 THEN 'Medium'
                     ELSE 'Large'
                 END
        ORDER BY total_amount DESC, amount_band ASC;
    - id: M21
      difficulty: medium
      question: "For payments made in 2004, group them by the weekday of the payment date. Return the weekday number, payment count, and total amount. List the weekday numbers from 1 through 7."
      groundtruth_sql: |
        SELECT DAYOFWEEK(paymentDate) AS payment_weekday,
               COUNT(*) AS payment_count,
               SUM(amount) AS total_amount
        FROM payments
        WHERE YEAR(paymentDate) = 2004
        GROUP BY DAYOFWEEK(paymentDate)
        ORDER BY payment_weekday ASC;
    - id: M22
      difficulty: medium
      question: "For each payment row, return the customer number, check number, payment date, amount, and the gap between that amount and the average payment amount for the same customer. Sort by customer number ascending, then payment date ascending, then check number ascending."
      groundtruth_sql: |
        SELECT customerNumber,
               checkNumber,
               paymentDate,
               amount,
               amount - AVG(amount) OVER (
                   PARTITION BY customerNumber
               ) AS amount_gap_from_customer_average
        FROM payments
        ORDER BY customerNumber ASC, paymentDate ASC, checkNumber ASC;
    - id: M23
      difficulty: medium
      question: "Find payment rows whose amount is above that customer's average payment amount. Return the customer number, check number, payment date, and amount. Sort by customer number ascending, then amount descending, then payment date descending."
      groundtruth_sql: |
        SELECT customerNumber, checkNumber, paymentDate, amount
        FROM payments p
        WHERE amount > (
            SELECT AVG(p2.amount)
            FROM payments p2
            WHERE p2.customerNumber = p.customerNumber
        )
        ORDER BY customerNumber ASC, amount DESC, paymentDate DESC;
    - id: M24
      difficulty: medium
      question: "Within each product scale, rank products by quantity in stock from highest to lowest. If products tie on quantity, let them share the same rank without skipping the next rank number. Return the product scale, product code, product name, quantity in stock, and the dense rank. Sort by product scale, then rank, then product code."
      groundtruth_sql: |
        SELECT productScale,
               productCode,
               productName,
               quantityInStock,
               DENSE_RANK() OVER (
                   PARTITION BY productScale
                   ORDER BY quantityInStock DESC
               ) AS stock_rank
        FROM products
        ORDER BY productScale ASC, stock_rank ASC, productCode ASC;
    - id: M25
      difficulty: medium
      question: "Rank product lines by the length of their names from longest to shortest. Return the product line, the name length, and that rank. Sort by rank first, then product line."
      groundtruth_sql: |
        SELECT productLine,
               CHAR_LENGTH(productLine) AS line_name_length,
               DENSE_RANK() OVER (ORDER BY CHAR_LENGTH(productLine) DESC) AS length_rank
        FROM productlines
        ORDER BY length_rank ASC, productLine ASC;
    - id: M26
      difficulty: medium
      question: "Show product lines whose description is longer than the average description length across all product lines. Return the product line and the description length. Sort by description length descending, then product line ascending."
      groundtruth_sql: |
        SELECT productLine, CHAR_LENGTH(textDescription) AS description_length
        FROM productlines
        WHERE CHAR_LENGTH(textDescription) > (
            SELECT AVG(CHAR_LENGTH(textDescription))
            FROM productlines
        )
        ORDER BY description_length DESC, productLine ASC;
    - id: M27
      difficulty: medium
      question: "Group products by product scale. Return the product scale, product count, average listed price, and the highest quantity in stock. Keep only scales whose average listed price is above 120. Sort by average listed price descending, then product scale ascending."
      groundtruth_sql: |
        SELECT productScale,
               COUNT(*) AS product_count,
               AVG(MSRP) AS average_listed_price,
               MAX(quantityInStock) AS highest_quantity_in_stock
        FROM products
        GROUP BY productScale
        HAVING AVG(MSRP) > 120
        ORDER BY average_listed_price DESC, productScale ASC;
    - id: M28
      difficulty: medium
      question: "Inside each product vendor, number products by buy price from lowest to highest. Break ties with the smaller product code first. Return the vendor, product code, product name, buy price, and that position. Sort by vendor, then position, then product code."
      groundtruth_sql: |
        SELECT productVendor,
               productCode,
               productName,
               buyPrice,
               ROW_NUMBER() OVER (
                   PARTITION BY productVendor
                   ORDER BY buyPrice ASC, productCode ASC
               ) AS buy_price_position
        FROM products
        ORDER BY productVendor ASC, buy_price_position ASC, productCode ASC;
    - id: M29
      difficulty: medium
      question: "Find products whose quantity in stock is above the average quantity in stock within the same product scale. Return the product code, product name, product scale, and quantity in stock. Sort by product scale ascending, then quantity in stock descending, then product code ascending."
      groundtruth_sql: |
        SELECT productCode, productName, productScale, quantityInStock
        FROM products p
        WHERE quantityInStock > (
            SELECT AVG(p2.quantityInStock)
            FROM products p2
            WHERE p2.productScale = p.productScale
        )
        ORDER BY productScale ASC, quantityInStock DESC, productCode ASC;
    - id: M30
      difficulty: medium
      question: "Within each product line, compute a running total of quantity in stock after sorting products from highest to lowest quantity in stock. Break ties with the smaller product code first. Return the product line, product code, quantity in stock, and the running stock total. Sort by product line, then quantity in stock descending, then product code ascending."
      groundtruth_sql: |
        SELECT productLine,
               productCode,
               quantityInStock,
               SUM(quantityInStock) OVER (
                   PARTITION BY productLine
                   ORDER BY quantityInStock DESC, productCode ASC
               ) AS running_stock_total
        FROM products
        ORDER BY productLine ASC, quantityInStock DESC, productCode ASC;
