cases:
    - id: E1
      difficulty: easy
      question: "List all customers in Japan, showing their names and cities, sorted by city."
      groundtruth_sql: |
        SELECT customerName, city 
        FROM customers 
        WHERE country = 'Japan' 
        ORDER BY city; 
    - id: E2
      difficulty: easy
      question: "Show the 10 products with the highest stock levels. Display the product code, name, and quantity in stock."
      groundtruth_sql: |
        SELECT productCode, productName, quantityInStock 
        FROM products 
        ORDER BY quantityInStock 
        DESC LIMIT 10;
    - id: E3
      difficulty: easy
      question: "List all orders placed in the year 2004. Show the order number and order date, ordered by order date from the latest."
      groundtruth_sql: |
        SELECT orderNumber, orderDate 
        FROM orders 
        WHERE YEAR(orderDate) = 2004 
        ORDER BY orderDate DESC;
    - id: E4
      difficulty: easy
      question: "Find all payments with an amount greater than 10,000. Show the customer number, check number, and amount, ordered by amount from highest to lowest."
      groundtruth_sql: |
        SELECT customerNumber, checkNumber, amount 
        FROM payments 
        WHERE amount > 10000 
        ORDER BY amount DESC;
    - id: E5
      difficulty: easy
      question: "Find offices where the state information is missing. Show the office code, city, country, and state."
      groundtruth_sql: |
        SELECT officeCode, city, country, state 
        FROM offices 
        WHERE (state IS NULL OR state = '');
    - id: E6
      difficulty: easy
      question: "Find all products whose names start with “196”. Show their product codes and names."
      groundtruth_sql: |
        SELECT productCode, productName 
        FROM products 
        WHERE productName LIKE '196%';
    - id: E7
      difficulty: easy
      question: "Find employees who work in offices with codes 1, 2, or 3. Show their employee numbers, first names, last names, and office codes."
      groundtruth_sql: |
        SELECT employeeNumber, firstName, lastName, officeCode 
        FROM employees 
        WHERE officeCode IN ('1', '2', '3');
    - id: E8
      difficulty: easy
      question: "Find employees whose phone extension starts with the letter ”x” followed by exactly three digits. Show their employee numbers, first names, last names, and extensions."
      groundtruth_sql: |
        SELECT employeeNumber, firstName, lastName, extension 
        FROM employees 
        WHERE extension REGEXP '^x[0-9]{3}$';
    - id: E9
      difficulty: easy
      question: "Show orders that are either in status “Cancelled” or “On Hold”. Display the order number, order date, and status."
      groundtruth_sql: |
        SELECT orderNumber, orderDate, status 
        FROM orders 
        WHERE status IN('Cancelled','On Hold');
    - id: E10
      difficulty: easy
      question: "Find products whose stock quantity is at least 500 and at most 1000 units. Show their product codes, names, and stock quantities."
      groundtruth_sql: |
        SELECT productCode, productName, quantityInStock 
        FROM products 
        WHERE quantityInStock BETWEEN 500 AND 1000;
    - id: E11
      difficulty: easy
      question: "What countries do we currently have customers in? Return one row per country, sorted alphabetically."
      groundtruth_sql: |
        SELECT DISTINCT
          country
        FROM customers
        ORDER BY
          country ASC;
    - id: E12
      difficulty: easy
      question: "Show all offices and display the state as 'N/A' whenever the state information is missing. Return office code, city, country, and the displayed state value. Sort by office code ascending."
      groundtruth_sql: |
        SELECT
          officeCode,
          city,
          country,
          COALESCE(state, 'N/A') AS state_display
        FROM offices
        ORDER BY
          officeCode ASC;
    - id: E13
      difficulty: easy
      question: "Show orders that were shipped after their required date. Return order number, required date, and shipped date. Sort by shipped date descending, then order number ascending."
      groundtruth_sql: |
        SELECT
          orderNumber,
          requiredDate,
          shippedDate
        FROM orders
        WHERE shippedDate > requiredDate
        ORDER BY
          shippedDate DESC,
          orderNumber ASC;
    - id: M1
      difficulty: medium
      question: "For each month in 2004, show the month name and the number of orders placed in that month, ordered from the latest month to the earliest."
      groundtruth_sql: |
        SELECT 
          DATE_FORMAT(orderDate, '%M') AS month_name,
          COUNT(orderNumber) AS order_count
        FROM orders
        WHERE YEAR(orderDate) = 2004
        GROUP BY MONTH(orderDate), DATE_FORMAT(orderDate, '%M')
        ORDER BY MONTH(orderDate) DESC
    - id: M2
      difficulty: medium
      question: "Classify products into three MSRP bands (Low: < 50, Mid: 50–150, High: > 150) and show the number of products in each band, ordered by product count in descending order."
      groundtruth_sql: |
        SELECT
          CASE
            WHEN MSRP < 50 THEN 'Low'
            WHEN MSRP BETWEEN 50 AND 150 THEN 'Mid'
            ELSE 'High'
          END AS price_band,
          COUNT(*) AS product_count
        FROM products
        GROUP BY
          CASE
            WHEN MSRP < 50 THEN 'Low'
            WHEN MSRP BETWEEN 50 AND 150 THEN 'Mid'
            ELSE 'High'
          END
        ORDER BY product_count DESC;
    - id: M3
      difficulty: medium
      question: "For each customer id, return the payment record with the largest payment amount. If multiple payments have the same amount, choose the one with the latest payment date. Include the payment amount and the payment date in the result."
      groundtruth_sql: |
          SELECT
            pmt.customerNumber,
            pmt.amount,
            pmt.paymentDate
          FROM (
          SELECT 
            customerNumber, 
            amount, 
            paymentDate,
            ROW_NUMBER() OVER (PARTITION BY customerNumber ORDER BY amount DESC, paymentDate DESC) AS rn
          FROM payments) AS pmt
          WHERE pmt.rn = 1;
    - id: M4
      difficulty: medium
      question: "For each order status, show the total number of orders and the earliest order date associated with that status." 
      groundtruth_sql: |
        SELECT
          status,
          COUNT(orderNumber) AS total_orders,
          MIN(orderDate) AS earliest_order_date
        FROM orders
        GROUP BY status;
    - id: M5
      difficulty: medium
      question: "Compute the average payment amount per customer and return the customer ID, and average payment for customers with an average payment above 50,000."
      groundtruth_sql: |
        SELECT
          customerNumber,
          AVG(amount) AS average_payment
        FROM payments
        GROUP BY customerNumber
        HAVING AVG(amount) > 50000;
    - id: M6
      difficulty: medium
      question: "Return the customer name and customer ID for customers with a credit limit greater than the average credit limit across all customers."
      groundtruth_sql: |
        SELECT
          customerName,
          customerNumber
        FROM customers
        WHERE creditLimit > (SELECT AVG(creditLimit) FROM customers);
    - id: M7
      difficulty: medium
      question: "For each order status, calculate the percentage of orders in that status with a non-null shipped date. Return the status and the calculated percentage, ordered by percentage in descending order."
      groundtruth_sql: |  
        SELECT
          status,
          (SUM(CASE WHEN shippedDate IS NOT NULL THEN 1 ELSE 0 END) * 100 / COUNT(*)) AS shipped_percentage
        FROM orders
        GROUP BY status
        ORDER BY shipped_percentage DESC;
    - id: M8
      difficulty: medium
      question: "For each product line, count the total number of products and return only product lines with more than 5 products."
      groundtruth_sql: |  
        SELECT
          productLine,
          COUNT(*) AS total_products
        FROM products
        GROUP BY productLine
        HAVING COUNT(*) > 5;
    - id: M9
      difficulty: medium
      question: "For each office territory, show the number of offices located in that territory, ordered by the office count in descending order."
      groundtruth_sql: |
        SELECT
          territory,
          COUNT(*) AS office_count
        FROM offices
        GROUP BY territory
        ORDER BY office_count DESC;
    - id: M10
      difficulty: medium
      question: "Return the employee number, job title, and a rank of employees within each job title based on employee number in descending order."
      groundtruth_sql: |
        SELECT
          employeeNumber,
          jobTitle,
          RANK() OVER (
            PARTITION BY jobTitle
            ORDER BY employeeNumber DESC
          ) AS employee_rank
        FROM employees;
    - id: M11
      difficulty: medium
      question: "For each customer, return the customer ID and the payment amount from their second payment row when that customer's payments are sorted by amount in descending order. Exclude customers who have fewer than two payment records."
      groundtruth_sql: |
        SELECT
          pmt.customerNumber,
          pmt.amount
        FROM (
          SELECT 
            customerNumber
            ,amount
            ,ROW_NUMBER() OVER (PARTITION BY customerNumber ORDER BY amount DESC) AS rn 
          FROM payments) pmt
        WHERE rn = 2;
    - id: M12
      difficulty: medium
      question: "For each payment record, return the customer number, payment date, amount, and the running cumulative payment amount for that customer in payment-date order."
      groundtruth_sql: |
        SELECT
          customerNumber,
          paymentDate,
          amount,
          SUM(amount) OVER (
            PARTITION BY customerNumber
            ORDER BY paymentDate
          ) AS cumulative_payment
        FROM payments;
    - id: M13
      difficulty: medium
      question: "For each employee, return the employee number, job title, and the total number of employees within the same office."
      groundtruth_sql: |
        SELECT
          employeeNumber,
          jobTitle,
          COUNT(*) OVER (
            PARTITION BY officeCode
          ) AS employees_in_same_office
        FROM employees;
    - id: M14
      difficulty: medium
      question: "For each product, return the product code, buy price, and the average buy price within the same product line."
      groundtruth_sql: |
        SELECT
          productCode,
          buyPrice,
          AVG(buyPrice) OVER (
            PARTITION BY productLine
          ) AS average_buy_price_per_line
        FROM products; 
    - id: M15
      difficulty: medium
      question: "For each product, return the product code, quantity in stock, and the percentage contribution of its quantity in stock to the total quantity in stock across all products."
      groundtruth_sql: |
        SELECT
          productCode,
          quantityInStock,
          (quantityInStock * 100.0 / SUM(quantityInStock) OVER ()) AS stock_percentage
        FROM products;
    - id: M16
      difficulty: medium
      question: "Show orders from 2003 and 2004 in one result. Return order number and a year label ('2003' or '2004'). Remove duplicate rows and sort by year label ascending, then order number ascending."
      groundtruth_sql: |
        SELECT
          orderNumber,
          '2003' AS year_label
        FROM orders
        WHERE YEAR(orderDate) = 2003
        UNION
        SELECT
          orderNumber,
          '2004' AS year_label
        FROM orders
        WHERE YEAR(orderDate) = 2004
        ORDER BY
          year_label ASC,
          orderNumber ASC;
    - id: M17
      difficulty: medium
      question: "For each order year, show how many distinct order statuses appear in that year. Return the year and the distinct status count, ordered by year ascending."
      groundtruth_sql: |
        SELECT
          YEAR(orderDate) AS order_year,
          COUNT(DISTINCT status) AS distinct_status_count
        FROM orders
        GROUP BY
          YEAR(orderDate)
        ORDER BY
          order_year ASC;
    - id: M18
      difficulty: medium
      question: "For each payment record, return the customer number, payment date, amount, and the previous payment amount in that customer's payment-date sequence. Sort the final result by customer number ascending, then payment date descending."
      groundtruth_sql: |
        SELECT
          customerNumber,
          paymentDate,
          amount,
          LAG(amount) OVER (
            PARTITION BY customerNumber
            ORDER BY paymentDate
          ) AS previous_payment_amount
        FROM payments
        ORDER BY
          customerNumber ASC,
          paymentDate DESC;
    - id: M19
      difficulty: medium
      question: "Show all orders placed on the most recent order date in the dataset. Return order number, order date, and status. Sort by order number ascending."
      groundtruth_sql: |
        SELECT
          orderNumber,
          orderDate,
          status
        FROM orders
        WHERE orderDate = (
          SELECT MAX(orderDate)
          FROM orders
        )
        ORDER BY
          orderNumber ASC;
    - id: M20
      difficulty: medium
      question: "For each country, show how many different customer cities we have in that country. Return only countries that have customers in more than 3 distinct cities. Show the country and distinct city count, ordered by distinct city count descending, then country ascending."
      groundtruth_sql: |
        SELECT
          country,
          COUNT(DISTINCT city) AS distinct_city_count
        FROM customers
        GROUP BY
          country
        HAVING
          COUNT(DISTINCT city) > 3
        ORDER BY
          distinct_city_count DESC,
          country ASC;
    - id: H1
      difficulty: hard
      question: "For each customer, show their customer name, id and total payment amount in 2004, and only include customers whose total is greater than 50,000."
      groundtruth_sql: |
        SELECT
          cust.customerNumber,
          cust.customerName,
          SUM(pmt.amount) AS total_payment_amount
        FROM customers AS cust
        LEFT JOIN payments AS pmt ON cust.customerNumber = pmt.customerNumber AND YEAR(pmt.paymentDate) = 2004
        GROUP BY cust.customerNumber, cust.customerName
        HAVING SUM(pmt.amount) > 50000;
    - id: H2
      difficulty: hard
      question: "Show only customers who have placed orders, and for each such customer display the customer number, customer name, and total number of orders they have placed."
      groundtruth_sql: |
        SELECT
          cust.customerNumber,
          cust.customerName,
          COUNT(ord.orderNumber) AS total_orders
        FROM customers AS cust
        JOIN orders AS ord ON cust.customerNumber = ord.customerNumber
        GROUP BY cust.customerNumber, cust.customerName;
    - id: H3
      difficulty: hard
      question: "Show only products that have been ordered at least once, and for each such product display the product code, product name, and total quantity ordered."
      groundtruth_sql: |
        SELECT
          p.productCode,
          p.productName,
          SUM(od.quantityOrdered) AS total_quantity_ordered
        FROM products AS p
        JOIN orderdetails AS od
          ON p.productCode = od.productCode
        GROUP BY p.productCode, p.productName;
    - id: H4
      difficulty: hard
      question: "Show only customers who have placed orders, and for each such customer display the customer number, customer name, and total order amount calculated as the sum of quantity ordered multiplied by price each."
      groundtruth_sql: |
        SELECT
          cust.customerNumber,
          cust.customerName,
          SUM(od.quantityOrdered * od.priceEach) AS total_order_amount
        FROM customers AS cust
        JOIN orders AS ord
          ON cust.customerNumber = ord.customerNumber
        JOIN orderdetails AS od
          ON ord.orderNumber = od.orderNumber
        GROUP BY cust.customerNumber, cust.customerName;
    - id: H5
      difficulty: hard
      question: "For each employee, including employees who do not manage any customers and customers who have never made any payments, show the employee number, employee name, and the total payment amount collected by their customers."
      groundtruth_sql: |
        SELECT
          emp.employeeNumber,
          CONCAT(emp.firstName, ' ', emp.lastName) AS employee_name,
          SUM(pmt.amount) AS total_payment_amount
        FROM employees AS emp
        LEFT JOIN customers AS cust
          ON emp.employeeNumber = cust.salesRepEmployeeNumber
        LEFT JOIN payments AS pmt
          ON cust.customerNumber = pmt.customerNumber
        GROUP BY
          emp.employeeNumber,
          emp.firstName,
          emp.lastName;
    - id: H6
      difficulty: hard
      question: "Show only products that have been ordered, and for each such product display the product code, product name, and rank the products by total sales value calculated using the actual price charged on each order line, in descending order."
      groundtruth_sql: |
        SELECT
          p.productCode,
          p.productName,
          RANK() OVER (
            ORDER BY SUM(od.quantityOrdered * od.priceEach) DESC
          ) AS sales_rank
        FROM products AS p
        JOIN orderdetails AS od
          ON p.productCode = od.productCode
        GROUP BY p.productCode, p.productName;
    - id: H7
      difficulty: hard
      question: "Show customers with payments, and for each customer return customer id, customer name, latest payment date in their most recent payment year, and total amount paid in that year. Order by latest payment date descending"
      groundtruth_sql: |
        SELECT
          c.customerNumber,
          c.customerName,
          MAX(p.paymentDate) AS latest_payment_date_in_latest_year,
          SUM(p.amount) AS total_payment_in_latest_year
        FROM customers AS c
        JOIN (
          SELECT
            customerNumber,
            MAX(YEAR(paymentDate)) AS latest_year
          FROM payments
          GROUP BY customerNumber
        ) AS ly
          ON ly.customerNumber = c.customerNumber
        JOIN payments AS p
          ON p.customerNumber = c.customerNumber
         AND YEAR(p.paymentDate) = ly.latest_year
        GROUP BY c.customerNumber, c.customerName
        ORDER BY MAX(p.paymentDate) DESC;
    - id: H8
      difficulty: hard
      question: "For each product that has been ordered at least once, find the year of its most recent order. Return the product code, product name, that latest order year, and the total quantity ordered for the product in that same year. Order the results by total quantity (in the latest year) descending, then by product code ascending."
      groundtruth_sql: |
        SELECT
          p.productCode,
          p.productName,
          ly.latest_year AS latest_order_year,
          SUM(od.quantityOrdered) AS total_quantity_in_latest_year
        FROM products AS p
        JOIN (
          SELECT
            od2.productCode,
            MAX(YEAR(o2.orderDate)) AS latest_year
          FROM orderdetails AS od2
          JOIN orders AS o2
            ON o2.orderNumber = od2.orderNumber
          GROUP BY od2.productCode
        ) AS ly
          ON ly.productCode = p.productCode
        JOIN orderdetails AS od
          ON od.productCode = p.productCode
        JOIN orders AS o
          ON o.orderNumber = od.orderNumber
        AND YEAR(o.orderDate) = ly.latest_year
        GROUP BY
          p.productCode,
          p.productName,
          ly.latest_year
        ORDER BY
          total_quantity_in_latest_year DESC,
          p.productCode ASC;
    - id: H9
      difficulty: hard
      question: "Show product lines that have at least one product with MSRP greater than the average MSRP of all products. For each such product line, display the product line name and the number of products in that line that satisfy that MSRP condition. Sort it so product lines with more qualifying products appear first; if there’s a tie, sort by product line name A–Z."
      groundtruth_sql: |
        SELECT
          pl.productLine,
          COUNT(*) AS product_count
        FROM productlines AS pl
        JOIN products AS p
          ON p.productLine = pl.productLine
        WHERE p.MSRP > (
          SELECT AVG(p2.MSRP)
          FROM products AS p2
        )
        GROUP BY
          pl.productLine
        ORDER BY
          product_count DESC,
          pl.productLine ASC;
    - id: H10
      difficulty: hard
      question: "For each office, show the office code, city, total number of employees, and how many of them are Sales Reps (jobTitle = 'Sales Rep'). Only include offices that have at least one Sales Rep, and where at least one employee in that office reports to someone (reportsTo is not NULL). Sort by Sales Rep count (highest first), then by office code."
      groundtruth_sql: |
        SELECT
          o.officeCode,
          o.city,
          COUNT(e.employeeNumber) AS total_employees,
          SUM(CASE WHEN e.jobTitle = 'Sales Rep' THEN 1 ELSE 0 END) AS sales_rep_count
        FROM offices AS o
        JOIN employees AS e
          ON e.officeCode = o.officeCode
        GROUP BY
          o.officeCode,
          o.city
        HAVING
          SUM(CASE WHEN e.jobTitle = 'Sales Rep' THEN 1 ELSE 0 END) > 0
          AND EXISTS (
            SELECT 1
            FROM employees AS e2
            WHERE e2.officeCode = o.officeCode
              AND e2.reportsTo IS NOT NULL
          )
        ORDER BY
          sales_rep_count DESC,
          o.officeCode ASC;
    - id: H11
      difficulty: hard
      question: "Show customers who have made at least one payment but have never placed any orders. Return customer id, customer name, and total payment amount. Sort by total payment amount descending, then customer id ascending."
      groundtruth_sql: |
        SELECT
          c.customerNumber,
          c.customerName,
          SUM(p.amount) AS total_payment_amount
        FROM customers AS c
        JOIN payments AS p
          ON p.customerNumber = c.customerNumber
        LEFT JOIN orders AS o
          ON o.customerNumber = c.customerNumber
        GROUP BY
          c.customerNumber,
          c.customerName
        HAVING
          COUNT(o.orderNumber) = 0
        ORDER BY
          total_payment_amount DESC,
          c.customerNumber ASC;
    - id: H12
      difficulty: hard
      question: "Show offices where the average credit limit of customers assigned to employees in that office is higher than the overall average credit limit across all customers (ignore NULL credit limit). Return office code, city, and average credit limit. Sort by average credit limit descending, then office code ascending."
      groundtruth_sql: |
        SELECT
          o.officeCode,
          o.city,
          AVG(c.creditLimit) AS avg_credit_limit
        FROM offices AS o
        JOIN employees AS e
          ON e.officeCode = o.officeCode
        JOIN customers AS c
          ON c.salesRepEmployeeNumber = e.employeeNumber
        GROUP BY
          o.officeCode,
          o.city
        HAVING
          AVG(c.creditLimit) > (
            SELECT AVG(c2.creditLimit)
            FROM customers AS c2
            WHERE c2.creditLimit IS NOT NULL
          )
        ORDER BY
          avg_credit_limit DESC,
          o.officeCode ASC;
    - id: H13
      difficulty: hard
      question: "For each employee (including employees who have no customers and customers who have no payments), show the employee id and full name, plus the most recent payment made by any of their customers. Return employee id, employee name, customer id, payment date, and amount. If there are multiple payments on the same most recent date, pick the largest amount. Sort by payment date descending, then employee number ascending."
      groundtruth_sql: |
        SELECT
          t.employeeNumber,
          t.employee_name,
          t.customerNumber,
          t.paymentDate,
          t.amount
        FROM (
          SELECT
            e.employeeNumber,
            CONCAT(e.firstName, ' ', e.lastName) AS employee_name,
            c.customerNumber,
            p.paymentDate,
            p.amount,
            ROW_NUMBER() OVER (
              PARTITION BY e.employeeNumber
              ORDER BY p.paymentDate DESC, p.amount DESC, c.customerNumber ASC
            ) AS rn
          FROM employees AS e
          LEFT JOIN customers AS c
            ON c.salesRepEmployeeNumber = e.employeeNumber
          LEFT JOIN payments AS p
            ON p.customerNumber = c.customerNumber
        ) AS t
        WHERE t.rn = 1
        ORDER BY
          t.paymentDate DESC,
          t.employeeNumber ASC;
    - id: H14
      difficulty: hard
      question: "Show customers who have placed at least one order. For each such customer, return customer id, customer name, total number of orders, total payment amount, and a payment_status flag ('Paid' if total payments > 0 else 'Unpaid'). Sort by total orders descending, then customer id."
      groundtruth_sql: |
        SELECT
          c.customerNumber,
          c.customerName,
          o.total_orders,
          COALESCE(p.total_payments, 0) AS total_payments,
          CASE
            WHEN COALESCE(p.total_payments, 0) > 0 THEN 'Paid'
            ELSE 'Unpaid'
          END AS payment_status
        FROM customers AS c
        JOIN (
          SELECT
            customerNumber,
            COUNT(*) AS total_orders
          FROM orders
          GROUP BY customerNumber
        ) AS o
          ON o.customerNumber = c.customerNumber
        LEFT JOIN (
          SELECT
            customerNumber,
            SUM(amount) AS total_payments
          FROM payments
          GROUP BY customerNumber
        ) AS p
          ON p.customerNumber = c.customerNumber
        ORDER BY
          o.total_orders DESC,
          c.customerNumber ASC;
    - id: H15
      difficulty: hard
      question: "Show products that were ordered in 2004 but never ordered in 2005. For each product, return product code, product name, and total quantity ordered in 2004. Sort by total quantity descending, then product code ascending."
      groundtruth_sql: |
        SELECT
          p.productCode,
          p.productName,
          SUM(od.quantityOrdered) AS total_quantity_2004
        FROM products AS p
        JOIN orderdetails AS od
          ON od.productCode = p.productCode
        JOIN orders AS o
          ON o.orderNumber = od.orderNumber
        WHERE YEAR(o.orderDate) = 2004
          AND NOT EXISTS (
            SELECT 1
            FROM orderdetails AS od2
            JOIN orders AS o2
              ON o2.orderNumber = od2.orderNumber
            WHERE od2.productCode = p.productCode
              AND YEAR(o2.orderDate) = 2005
          )
        GROUP BY
          p.productCode,
          p.productName
        ORDER BY
          total_quantity_2004 DESC,
          p.productCode ASC;
    - id: H16
      difficulty: hard
      question: "Show customers who have ordered more than 20 distinct products. Return customer id, customer name, and the number of distinct products they have ordered. Sort by distinct product count descending, then customer id ascending."
      groundtruth_sql: |
        SELECT
          c.customerNumber,
          c.customerName,
          COUNT(DISTINCT od.productCode) AS distinct_product_count
        FROM customers AS c
        JOIN orders AS o
          ON o.customerNumber = c.customerNumber
        JOIN orderdetails AS od
          ON od.orderNumber = o.orderNumber
        GROUP BY
          c.customerNumber,
          c.customerName
        HAVING
          COUNT(DISTINCT od.productCode) > 20
        ORDER BY
          distinct_product_count DESC,
          c.customerNumber ASC;
    - id: H17
      difficulty: hard
      question: "For each product line, show the best-selling product based on total quantity ordered. If multiple products tie on quantity, choose the one with the higher total sales amount calculated using the actual price charged on each order line; if there is still a tie, choose the product with the smaller product code. Return product line, product code, product name, total quantity ordered, and total sales value. Sort by product line ascending."
      groundtruth_sql: |
        SELECT
          ranked.productLine,
          ranked.productCode,
          ranked.productName,
          ranked.total_quantity_ordered,
          ranked.total_sales_value
        FROM (
          SELECT
            p.productLine,
            p.productCode,
            p.productName,
            SUM(od.quantityOrdered) AS total_quantity_ordered,
            SUM(od.quantityOrdered * od.priceEach) AS total_sales_value,
            ROW_NUMBER() OVER (
              PARTITION BY p.productLine
              ORDER BY
                SUM(od.quantityOrdered) DESC,
                SUM(od.quantityOrdered * od.priceEach) DESC,
                p.productCode ASC
            ) AS rn
          FROM products AS p
          JOIN orderdetails AS od
            ON od.productCode = p.productCode
          GROUP BY
            p.productLine,
            p.productCode,
            p.productName
        ) AS ranked
        WHERE ranked.rn = 1
        ORDER BY
          ranked.productLine ASC;
