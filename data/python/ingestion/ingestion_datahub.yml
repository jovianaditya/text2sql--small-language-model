pipeline_name: california_schools_ingestion

source:
  type: postgres
  config:
    username: datahub
    password: datahub
    host_port: postgresql:5432
    database: california_schools
    include_tables: true
    include_views: false
    schema_pattern:
      allow:
        - public    # <-- empty dict, means all schemas

    stateful_ingestion:
      enabled: true
      remove_stale_metadata: false   # Set to true if you want to remove deleted tables from DataHub

