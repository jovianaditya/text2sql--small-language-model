pipeline_name: datahub_mysql_ingestion

source:
  type: mysql
  config:
    scheme: mysql+pymysql
    host_port: mysql:3306
    username: datahub
    password: datahub
    database: classicmodels
    include_tables: true
    include_views: false
    profiling:
      enabled: true
      limit: 5000
      field_sample_values_limit: 25
      include_field_null_count: true
      include_field_min_value: true
      include_field_max_value: true
      include_field_distinct_count: true
      include_field_sample_values: true
      include_field_mean_value: true
      include_field_median_value: true
      include_field_stddev_value: true
      max_workers: 4
    stateful_ingestion:
      enabled: true
      remove_stale_metadata: true

transformers:
  - type: "pattern_add_dataset_domain"
    config:
      semantics: OVERWRITE
      domain_pattern:
        rules:
          # Sales
          ".*classicmodels.orders.*": ["Sales"]
          ".*classicmodels.orderdetails.*": ["Sales"]

          # CRM
          ".*classicmodels.customers.*": ["CRM"]

          # HR
          ".*classicmodels.employees.*": ["HR"]

          # Catalog
          ".*classicmodels.products.*": ["Catalog"]
          ".*classicmodels.productlines.*": ["Catalog"]

          # Finance
          ".*classicmodels.payments.*": ["Finance"]

          # Geo
          ".*classicmodels.offices.*": ["Geo"]

  - type: "pattern_add_dataset_tags"
    config:
      semantics: PATCH
      tag_pattern:
        rules:
          ".*classicmodels.orders.*":
            - "urn:li:tag:dom.orders"
            - "urn:li:tag:dom.sales"
          ".*classicmodels.orderdetails.*":
            - "urn:li:tag:dom.orderdetails"
            - "urn:li:tag:dom.sales"
          ".*classicmodels.customers.*":
            - "urn:li:tag:dom.customers"
            - "urn:li:tag:dom.crm"
          ".*classicmodels.employees.*":
            - "urn:li:tag:dom.employees"
            - "urn:li:tag:dom.hr"
          ".*classicmodels.products.*":
            - "urn:li:tag:dom.products"
            - "urn:li:tag:dom.catalog"
          ".*classicmodels.productlines.*":
            - "urn:li:tag:dom.productlines"
            - "urn:li:tag:dom.catalog"
          ".*classicmodels.payments.*":
            - "urn:li:tag:dom.payments"
            - "urn:li:tag:dom.finance"
            - "urn:li:tag:dom.sales"
          ".*classicmodels.offices.*":
            - "urn:li:tag:dom.offices"
            - "urn:li:tag:dom.geo"

sink:
  type: datahub-rest
  config:
    server: http://datahub-gms:8080
    token: ${DATAHUB_TOKEN}

