player:
  "id": "Unique identifier of the player within the dataset."
  "player_api_id": "Internal identifier used in this dataset to link player information across tables."
  "player_name": "The full name of the player."
  "player_fifa_api_id": "The identifier of the player in the FIFA database."
  "birthday": "The date of birth of the player."
  "height": "The height of the player in centimeters."
  "weight": "The weight of the player in pounds."

player_attributes:
  "id": "Unique identifier of the player attributes record in the dataset."
  "player_fifa_api_id": "Identifier of the player in the FIFA database."
  "player_api_id": "Identifier of the player in the dataset."
  "date": "The date when the attributes were recorded."
  "overall_rating": "The overall rating of the player, between 0 and 100, as calculated by FIFA. A higher overall rating means the player has stronger overall performance."
  "potential": "The potential rating of the player, between 0 and 100, as calculated by FIFA. A higher potential rating means the player is expected to have greater future performance."
  "preferred_foot": "The player's preferred foot when playing, either right or left."
  "attacking_work_rate": "The player's attacking work rate. High means the player is involved in most attacking moves, medium means the player selects which attacks to join, and low means the player stays in position while the team attacks."
  "defensive_work_rate": "The player's defensive work rate. High means the player remains in position and defends during attacks, medium means the player chooses which defensive actions to join, and low means the player participates in attacking moves instead of defending."
  "crossing": "The player's crossing rating, from 0 to 100. It measures the accuracy and effectiveness of delivering long passes into the opponent's penalty area."
  "finishing": "The player's finishing rating, from 0 to 100. It measures the ability to convert goal-scoring opportunities into goals."
  "heading_accuracy": "The player's heading accuracy rating, from 0 to 100. It measures the ability to score or pass using headers."
  "short_passing": "The player's short passing rating, from 0 to 100. It measures the accuracy and quality of short passes."
  "volleys": "The player's volleys rating, from 0 to 100. It measures the ability to strike the ball cleanly while it is in the air."
  "dribbling": "The player's dribbling rating, from 0 to 100. It measures ball control and skill when moving past opponents."
  "curve": "The player's curve rating, from 0 to 100. It measures the ability to apply spin to the ball when passing or shooting."
  "free_kick_accuracy": "The player's free kick accuracy rating, from 0 to 100. It measures the effectiveness of taking direct free kicks."
  "long_passing": "The player's long passing rating, from 0 to 100. It measures the accuracy and effectiveness of long-range passes."
  "ball_control": "The player's ball control rating, from 0 to 100. It measures the ability to first-touch and maintain possession under pressure."
  "acceleration": "The player's acceleration rating, from 0 to 100. It measures how quickly the player can reach top speed."
  "sprint_speed": "The player's sprint speed rating, from 0 to 100. It measures the maximum running speed over distance."
  "agility": "The player's agility rating, from 0 to 100. It measures quickness and ease of movement when changing direction."
  "reactions": "The player's reactions rating, from 0 to 100. It measures response time to events such as loose balls or rebounds."
  "balance": "The player's balance rating, from 0 to 100. It measures stability and control while under physical pressure."
  "shot_power": "The player's shot power rating, from 0 to 100. It measures the force and speed of the player's shots."
  "jumping": "The player's jumping rating, from 0 to 100. It measures leaping ability when contesting headers or aerial duels."
  "stamina": "The player's stamina rating, from 0 to 100. It measures endurance and ability to sustain high performance throughout the match."
  "strength": "The player's strength rating, from 0 to 100. It measures physical power and ability to hold off opponents."
  "long_shots": "The player's long shots rating, from 0 to 100. It measures shooting accuracy and effectiveness from outside the penalty area."
  "aggression": "The player's aggression rating, from 0 to 100. It measures intensity and willingness to challenge opponents."
  "interceptions": "The player's interceptions rating, from 0 to 100. It measures the ability to anticipate and cut off passes."
  "positioning": "The player's positioning rating, from 0 to 100. It measures offensive awareness and ability to find goal-scoring positions."
  "vision": "The player's vision rating, from 0 to 100. It measures awareness and ability to make effective attacking passes."
  "penalties": "The player's penalties rating, from 0 to 100. It measures accuracy and composure when taking penalty kicks."
  "marking": "The player's marking rating, from 0 to 100. It measures ability to track and defend against opposing players."
  "standing_tackle": "The player's standing tackle rating, from 0 to 100. It measures effectiveness in dispossessing opponents while standing."
  "sliding_tackle": "The player's sliding tackle rating, from 0 to 100. It measures effectiveness in using sliding challenges to win the ball."
  "gk_diving": "The goalkeeper's diving rating, from 0 to 100. It measures ability to make diving saves."
  "gk_handling": "The goalkeeper's handling rating, from 0 to 100. It measures ability to catch or control the ball securely."
  "gk_kicking": "The goalkeeper's kicking rating, from 0 to 100. It measures accuracy and power when kicking the ball."
  "gk_positioning": "The goalkeeper's positioning rating, from 0 to 100. It measures ability to be in the right place to stop shots."
  "gk_reflexes": "The goalkeeper's reflexes rating, from 0 to 100. It measures reaction speed to unexpected or close-range shots."

team:
  "id": "Unique identifier of the team within the dataset."
  "team_api_id": "Internal identifier of the team used within the dataset."
  "team_fifa_api_id": "Identifier of the team in the FIFA database."
  "team_long_name": "The official long name of the team."
  "team_short_name": "The abbreviated short name of the team."

team_attributes:
  "id": "Unique identifier of the team attributes record within the dataset."
  "team_fifa_api_id": "Identifier of the team in the FIFA database."
  "team_api_id": "Internal identifier of the team used within the dataset."
  "date": "The date when the attributes were recorded."
  "buildUpPlaySpeed": "Numerical score from 1 to 100 measuring the speed at which a team builds its attacks. Higher values indicate faster buildup play."
  "buildUpPlaySpeedClass": "Categorical class of buildup play speed based on the numerical score. Slow (1-33), Balanced (34-66), or Fast (67-100)."
  "buildUpPlayDribbling": "Numerical score from 1 to 100 measuring the tendency and frequency of dribbling during buildup play. Higher values indicate more frequent dribbling."
  "buildUpPlayDribblingClass": "Categorical class of dribbling frequency based on the numerical score. Little (1-33), Normal (34-66), or Lots (67-100)."
  "buildUpPlayPassing": "Numerical score from 1 to 100 indicating passing style during buildup play. Higher values correspond to longer passing distances and less teammate support."
  "buildUpPlayPassingClass": "Categorical class of passing style based on the numerical score. Short (1-33), Mixed (34-66), or Long (67-100)."
  "buildUpPlayPositioningClass": "Categorical indicator of a team's movement strategy during the first two-thirds of the pitch. Organised means players stick to fixed positions, while Free Form allows players more freedom of movement."
  "chanceCreationPassing": "Numerical score from 1 to 100 that measures the amount of risk taken in passing decisions and the level of run support from teammates. Higher values indicate riskier passing strategies."
  "chanceCreationPassingClass": "Categorical class of passing style in chance creation based on the numerical score. Safe (1-33), Normal (34-66), or Risky (67-100)."
  "chanceCreationCrossing": "Numerical score from 1 to 100 that measures the tendency and frequency of crosses into the penalty box. Higher values indicate more frequent crossing."
  "chanceCreationCrossingClass": "Categorical class of crossing frequency based on the numerical score. Little (1-33), Normal (34-66), or Lots (67-100)."
  "chanceCreationShooting": "Numerical score from 1 to 100 that measures the tendency and frequency of shots taken. Higher values indicate a higher shooting tendency."
  "chanceCreationShootingClass": "Categorical class of shooting frequency based on the numerical score. Little (1-33), Normal (34-66), or Lots (67-100)."
  "chanceCreationPositioningClass": "Categorical indicator of a team's movement strategy in the final third of the pitch. Organised means players stick to fixed positions, while Free Form allows players greater freedom of movement."
  "defencePressure": "Numerical score from 1 to 100 that affects how high up the pitch the team begins applying pressure on the opponent. Higher values indicate pressing further up the field."
  "defencePressureClass": "Categorical class of defensive pressure based on the numerical score. Deep (1-33), Medium (34-66), or High (67-100)."
  "defenceAggression": "Numerical score from 1 to 100 that measures the team's overall approach to tackling and confronting the opponent in possession of the ball. Higher values indicate a more aggressive defensive style."
  "defenceAggressionClass": "Categorical class of defensive aggression based on the numerical score. Contain (1-33), Press (34-66), or Double (67-100)."
  "defenceTeamWidth": "Numerical score from 1 to 100 that determines how much the defensive line shifts towards the side of the ball. Higher values indicate a wider defensive shape."
  "defenceTeamWidthClass": "Categorical class of defensive width based on the numerical score. Narrow (1-33), Normal (34-66), or Wide (67-100)."
  "defenceDefenderLineClass": "Categorical indicator of defensive line strategy. Cover means defenders drop back to provide depth, while Offside Trap means defenders hold a higher line to catch attackers offside."

