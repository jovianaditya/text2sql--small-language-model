"constructorResults":
  "constructorResultsId": "Unique identifier for each constructor result record. Serves as the primary key."
  "raceId": "Identifier of the race associated with this result."
  "constructorId": "Identifier of the constructor (links to the constructors table)."
  "points": "Number of points awarded to the constructor in this race."
  "status": "Race completion status of the constructor. Empty means the constructor finished normally, 'D' indicates disqualified from the race."

"constructorStandings":
  "constructorStandingsId": "Unique identifier for each constructor standing record. Serves as the primary key."
  "raceId": "Identifier of the race associated with this standing."
  "constructorId": "Identifier of the constructor (links to the constructors table)."
  "points": "Number of points the constructor earned in this race."
  "position": "Numeric finishing position of the constructor in the race."
  "positionText": "Text representation of the finishing position (usually same as position, but can include special cases like 'DNF' for Did Not Finish)."
  "wins": "Cumulative number of wins the constructor has achieved up to and including this race."

constructors:
  "constructorId": "Unique identifier for each constructor. Serves as the primary key."
  "constructorRef": "Short reference name or code for the constructor, often used in datasets or URLs."
  "name": "Full official name of the constructor or team."
  "nationality": "Country of origin or nationality of the constructor."
  "url": "Link to a webpage with detailed information about the constructor, typically a Wikipedia page or official site. Detailed info can be obtained by visiting this URL."

"driverStandings":
  "driverStandingsId": "Unique identifier for each driver standing record."
  "raceId": "Identifier of the race."
  "driverId": "Identifier of the driver."
  "points": "Number of points acquired by the driver in the race."
  "position": "Finishing position of the driver in the race."
  "positionText": "Text representation of the finishing position."
  "wins": "Number of wins by the driver in the race."

drivers:
  "driverId": "Unique identifier for each driver."
  "driverRef": "Reference name of the driver."
  "number": "Car number of the driver."
  "code": "Abbreviated code of the driver. If null or empty, the driver does not have a code."
  "forename": "Forename of the driver."
  "surname": "Surname of the driver."
  "dob": "Date of birth of the driver."
  "nationality": "Nationality of the driver."
  "url": "Website link with an introduction to the driver."

"lapTimes":
  "raceId": "Identifier of the race."
  "driverId": "Identifier of the driver."
  "lap": "Lap number."
  "position": "Position of the driver during the lap."
  "time": "Lap time in minutes and seconds."
  "milliseconds": "Lap time in milliseconds."

"pitStops":
  "raceId": "Identifier of the race."
  "driverId": "Identifier of the driver."
  "stop": "Pit stop number for the driver."
  "lap": "Lap number on which the pit stop occurred."
  "time": "Exact time of the pit stop."
  "duration": "Duration of the pit stop in seconds."
  "milliseconds": "Duration of the pit stop in milliseconds."

qualifying:
  "qualifyId": "Unique identifier for each qualifying session."
  "raceId": "Identifier of the race."
  "driverId": "Identifier of the driver."
  "constructorId": "Identifier of the constructor (team)."
  "number": "Car number of the driver."
  "position": "Finishing position in the qualifying session."
  "q1": "Lap time in Qualifying 1 in minutes and seconds. All 20 drivers participate. Q1 times determine the order for Q2 and the slowest drivers are eliminated; the slowest driver starts 10th on the grid."
  "q2": "Lap time in Qualifying 2 in minutes and seconds. Only the top 15 drivers from Q1 participate. Q2 determines the order for Q3 and the five slowest drivers are eliminated; they start from 11th to 15th based on their best lap time."
  "q3": "Lap time in Qualifying 3 in minutes and seconds. Only the top 10 drivers from Q2 participate. Q3 times determine the top 10 grid positions for the race."

races:
  "raceId": "Unique identifier for each race."
  "year": "Year when the race took place."
  "round": "Round number of the race in the season."
  "circuitId": "Identifier of the circuit where the race was held."
  "name": "Official name of the race."
  "date": "Date of the race."
  "time": "Local start time of the race."
  "url": "Website link with an introduction to the race."

results:
  "resultId": "Unique identifier for each race result."
  "raceId": "Identifier of the race."
  "driverId": "Identifier of the driver."
  "constructorId": "Identifier of the constructor (team)."
  "number": "Car number of the driver."
  "grid": "Starting grid position of the car."
  "position": "Finishing position of the driver."
  "positionText": "Textual representation of the finishing position."
  "positionOrder": "Finishing order of positions."
  "points": "Points awarded for the race."
  "laps": "Number of laps completed by the driver."
  "time": "Finish time of the driver. If the value exists, the driver finished the race. The champion's time is shown in 'minutes:seconds.milliseconds', while other drivers' times are shown as the difference from the champion's time in 'seconds.milliseconds'."
  "milliseconds": "Actual finishing time of the driver in milliseconds."
  "fastestLap": "Number of the fastest lap completed by the driver."
  "rank": "Rank of the driver based on fastest lap speed."
  "fastestLapTime": "Time of the fastest lap. A smaller value indicates a higher rank."
  "fastestLapSpeed": "Speed of the fastest lap in km/h."
  "statusId": "Identifier linking to the status of the driver in the 'status' table."

seasons:
  "year": "Year of the Formula One season."
  "url": "Website link with an introduction to the season."

status:
  "statusId": "Unique identifier for each status."
  "status": "Full name of the status."

# STUDENT CLUB
attendance:
  "link_to_event": "Unique identifier of the event that was attended. References the Event table."
  "link_to_member": "Unique identifier of the member who attended the event. References the Member table."

budget:
  "budget_id": "Unique identifier for each budget entry. Serves as the primary key."
  "category": "The category for which the amount is budgeted, e.g., Advertisement, Food, Parking, Speaker Gifts."
  "amount": "The total amount allocated for the specified category and event. Unit: dollars."
  "spent": "The total amount spent so far in the budgeted category for the event. Summarized from the Expense table. Unit: dollars."
  "remaining": "Calculated as amount minus spent. Unit: dollars. If negative, it indicates the spending has exceeded the budget."
  "event_status": "Status of the event. 'Closed' means event is finished; spent and remaining values are final. 'Open' means event is ongoing; spent and remaining values may change as new expenses are added. 'Planning' means event has not started; spent and remaining values are not updated yet."
  "link_to_event": "Unique identifier of the event this budget entry belongs to. References the Event table."

event:
  "event_id": "Unique identifier for each event. Serves as the primary key."
  "event_name": "The official name of the event."
  "event_date": "The date and time the event took place or is scheduled to take place. Format: ISO 8601, e.g., 2020-03-10T12:00:00."
  "type": "The category or kind of event, such as Meeting, Game, Social, or Election."
  "notes": "Free text field for any additional information or notes about the event."
  "location": "Address, room, or venue name where the event is or will be held."
  "status": "Current status of the event. 'Planning' means event is being planned and has not started. 'Open' means event is ongoing or available for participation. 'Closed' means event is finished; no further updates expected."

expense:
  "expense_id": "Unique identifier for each expense record. Serves as the primary key."
  "expense_description": "Textual description of what the money was spent on."
  "expense_date": "The date the expense was incurred. Format: YYYY-MM-DD."
  "cost": "Amount of money spent in dollars. Unit: dollars."
  "approved": "Indicates whether the expense has been approved. Possible values are true or false."
  "link_to_member": "Identifier of the member who incurred the expense. References the Member table."
  "link_to_budget": "Identifier of the budget entry this expense belongs to. References the Budget table."

income:
  "income_id": "Unique identifier for each income record. Serves as the primary key."
  "date_received": "The date the funds were received. Format: YYYY-MM-DD."
  "amount": "Amount of funds received. Unit: dollars."
  "source": "Origin of the funds, e.g., membership dues, annual university allocation, or donations."
  "notes": "Free-text field for additional details about the receipt of funds."
  "link_to_member": "Identifier of the member associated with this income, if applicable. References the Member table."

major:
  "major_id": "Unique identifier for each major. Serves as the primary key."
  "major_name": "Official name of the major."
  "department": "Name of the department that offers the major."
  "college": "Name of the college or school that houses the department offering the major."

member:
  "member_id": "unique id of member"
  "first_name": "member's first name"
  "last_name": "member's last name"
  "email": "member's email"
  "position": "The position the member holds in the club"
  "t_shirt_size": "The size of tee shirt that member wants when shirts are ordered"
  "phone": "The best telephone at which to contact the member"
  "zip": "the zip code of the member's hometown"
  "link_to_major": "The unique identifier of the major of the member. References the Major table"
  
zip_code:
  "zip_code": "The ZIP code itself. Typically a five-digit number identifying a US post office."
  "type": "Type of ZIP code. 'Standard' means egular ZIP codes used by most people. 'PO Box' means ZIP codes assigned to post office boxes. 'Unique' means ZIP codes assigned to a single organization."
  "city": "The city or locality that the ZIP code pertains to."
  "county": "The county or equivalent jurisdiction that the ZIP code pertains to."
  "state": "The full name of the state or territory that the ZIP code belongs to."
  "short_state": "The standard two-letter abbreviation of the state or territory."

# SUPERHERO
alignment: 
  "id": "The unique identifier of the alignment."
  "alignment": "The alignment of the superhero. Alignment refers to a character's moral and ethical stance and can be used to describe the overall attitude or behavior of a superhero. Possible values include Good, for superheroes who are kind and selfless; Neutral, for those who act on personal interest or their own code (e.g., Hulk, Deadpool); Bad, for characters who are selfish and harmful (e.g., Lex Luthor, Joker); and N/A, when alignment is unknown or undefined."

attribute:
  "id": "The unique identifier of the attribute."
  "attribute_name": "A superhero's attribute is a characteristic or quality that defines their abilities and strengths. Attributes can be physical, such as superhuman strength or speed, or personal, such as intelligence or combat skills. Possible values include Intelligence, the ability to think and solve problems; Strength, physical power; Speed, quickness of movement; Durability, resistance to damage; Power, overall abilities or energy; and Combat, skill in fighting."

colour:
  "id": "The unique identifier of the color."
  "colour": "The color associated with a superhero's physical traits, such as skin, eyes, or hair. Possible values include examples like Black, Blond, Blue, or Brown."
  
gender:
  "id": "The unique identifier of the gender."
  "gender": "The gender of the superhero. Possible values include Male, Female, or N/A when gender is not specified."

hero_attribute:
  "hero_id": "The ID of the hero, maps to superhero(id)."
  "attribute_id": "The ID of the attribute, maps to attribute(id)."
  "attribute_value": "The numeric value representing how strong the hero is in a given attribute. A higher value means greater ability in that area; for example, a high strength value indicates the hero can lift heavier objects or hit harder than others."

hero_power:
  "hero_id": "The ID of the hero, maps to superhero(id)."
  "power_id": "The ID of the power, maps to superpower(id). While attributes describe a hero's overall qualities, powers represent the specific abilities they use, such as flying, super strength, or invisibility."

publisher:
  "id": "The unique identifier of the publisher."
  "publisher_name": "The name of the publisher, which may refer to a comic book company, media studio, or author. Examples include DC Comics, Dark Horse Comics, and Image Comics."

race:
  "id": "The unique identifier of the race."
  "race": "The race of the superhero, referring to the group or origin they belong to based on physical or cultural traits. Examples include Alien, Amazon, Android, or Atlantean."

superhero:
  "id": "The unique identifier of the superhero."
  "superhero_name": "The name of the superhero."
  "full_name": "The full name of the superhero, typically consisting of a given name and a surname (e.g., John Smith). If missing, a dash (-) may be used."
  "gender_id": "The ID of the superhero's gender, maps to gender(id)."
  "eye_colour_id": "The ID of the superhero's eye color, maps to colour(id)."
  "hair_colour_id": "The ID of the superhero's hair color, maps to colour(id)."
  "skin_colour_id": "The ID of the superhero's skin color, maps to colour(id)."
  "race_id": "The ID of the superhero's race, maps to race(id)."
  "publisher_id": "The ID of the publisher, maps to publisher(id)."
  "alignment_id": "The ID of the superhero's alignment, maps to alignment(id)."
  "height_cm": "The height of the superhero in centimeters. A value of NULL or 0 means the height is missing."
  "weight_kg": "The weight of the superhero in kilograms. A value of NULL or 0 means the weight is missing."

superpower:
  "id": "The unique identifier of the superpower."
  "power_name": "The name of the superpower, which represents a specific ability a superhero may possess. Examples include Flight, Agility, Energy Absorption, or Stealth."

# THROMBOSIS_PREDICTION
"Examination":
  "ID": "The unique identifier of the patient."
  "Examination Date": "The date of the medical examination."
  "aCL IgG": "Anti-Cardiolipin antibody (IgG) concentration."
  "aCL IgM": "Anti-Cardiolipin antibody (IgM) concentration."
  "ANA": "Anti-nucleus antibody concentration."
  "ANA Pattern": "The observed pattern in the ANA (anti-nucleus antibody) examination sheet."
  "aCL IgA": "Anti-Cardiolipin antibody (IgA) concentration."
  "Diagnosis": "The diagnosed disease names. For example: 'SLE', 'MCTD', 'PSS'."
  "KCT": "Test measuring degree of coagulation. '+' means positive, '-' means negative."
  "RVVT": "Test measuring degree of coagulation. '+' means positive, '-' means negative."
  "LAC": "Test measuring degree of coagulation. '+' means positive, '-' means negative."
  "Symptoms": "Other symptoms observed during examination. For example: 'AMI', 'vertigo'."
  "Thrombosis": "Degree of thrombosis, where '0' means negative (no thrombosis), '1' means positive (most serious), '2' means positive (severe), and '3' means positive (mild)."

"Laboratory":
  "ID": "The unique identifier of the patient."
  "Date": "Date of the laboratory tests (format: YYYY-MM-DD)."
  "GOT": "AST (glutamic oxaloacetic transaminase). Normal range: N < 60."
  "GPT": "ALT (glutamic pyruvic transaminase). Normal range: N < 60."
  "LDH": "Lactate dehydrogenase. Normal range: N < 500."
  "ALP": "Alkaline phosphatase. Normal range: N < 300."
  "TP": "Total protein. Normal range: 6.0 < N < 8.5."
  "ALB": "Albumin. Normal range: 3.5 < N < 5.5."
  "UA": "Uric acid. Normal range: N < 8.0 (Male), N < 6.5 (Female)."
  "UN": "Urea nitrogen. Normal range: 8.0 < N (Male), 6.5 < N (Female)."
  "CRE": "Creatinine. Normal range: N < 1.5."
  "T-BIL": "Total bilirubin. Normal range: N < 2.0."
  "T-CHO": "Total cholesterol. Normal range: N < 250."

  "TG": "Triglyceride. Normal range: N < 200."
  "CPK": "Creatinine phosphokinase. Normal range: N < 250."
  "GLU": "Blood glucose. Normal range: N < 180."
  "WBC": "White blood cell count. Normal range: 3.5 < N < 9.0."
  "RBC": "Red blood cell count. Normal range: 3.5 < N < 6.0."
  "HGB": "Hemoglobin. Normal range: 10 < N < 17."
  "HCT": "Hematocrit. Normal range: 29 < N < 52."
  "PLT": "Platelet count. Normal range: 100 < N < 400."
  "PT": "Prothrombin time. Normal range: N < 14."
  "APTT": "Activated partial thromboplastin time. Normal range: N < 45."
  "FG": "Fibrinogen. Normal range: 150 < N < 450."
  "PIC": "Plasmin-α2 plasmin inhibitor complex (PIC). Higher levels indicate fibrinolysis. Normal range not provided."
  "TAT": "Thrombin-antithrombin III complex (TAT). Marker of thrombin generation. Normal range not provided."
  "TAT2": "Additional thrombin-antithrombin marker (duplicate measure, range not provided)."
  "U-PRO": "Proteinuria (urine protein). Normal range: 0 < N < 30."
  "IGG": "Immunoglobulin G. Normal range: 900 < N < 2000."
  "IGA": "Immunoglobulin A. Normal range: 80 < N < 500."
  "IGM": "Immunoglobulin M. Normal range: 40 < N < 400."
  "CRP": "C-reactive protein. Normal range: N = '-', '+-', or N < 1.0."
  "RA": "Rheumatoid factor. Normal range: N = '-', '+-'."
  "RF": "RAHA (rheumatoid arthritis hemagglutination assay). Normal range: N < 20."
  "C3": "Complement 3. Normal range: N > 35."
  "C4": "Complement 4. Normal range: N > 10."
  "RNP": "Anti-ribonuclear protein antibody. Autoantibody marker for connective tissue disease."
  "SM": "Anti-Smith antibody. Normal range: N = '-', '+-'."
  "SC170": "Anti-Scl70 antibody (scleroderma marker). Normal range: N = '-', '+-'."
  "SSA": "Anti-SSA antibody (Ro antigen). Normal range: N = '-', '+-'."
  "SSB": "Anti-SSB antibody (La antigen). Normal range: N = '-', '+-'."
  "CENTROMEA": "Anti-centromere antibody. Normal range: N = '-', '+-'."
  "DNA": "Anti-DNA antibody. Normal range: N < 8."
  "DNA-II": "Anti-DNA antibody (alternative measure). Normal range: N < 8."

"Patient":
  "ID": "The unique identifier of the patient."
  "SEX": "The sex of the patient. 'F' for female, 'M' for male."
  "Birthday": "The date of birth of the patient."
  "Description": "The first date when patient data was recorded. Null or empty if not recorded."
  "First Date": "The date when the patient first came to the hospital. Null or empty if not recorded."
  "Admission": "Indicates whether the patient was admitted to the hospital '+' or followed at the outpatient clinic '-'."
  "Diagnosis": "The diagnosed disease names for the patient."

# TOXICOLOGY
atom:
  "atom_id": "The unique identifier of the atom."
  "molecule_id": "The ID of the molecule to which the atom belongs. The format TRXXX_i indicates the i-th atom of molecule TRXXX."
  "element": "The chemical element of the atom. Possible values include Cl (chlorine), C (carbon), H (hydrogen), O (oxygen), S (sulfur), N (nitrogen), P (phosphorus), Na (sodium), Br (bromine), F (fluorine), I (iodine), Sn (tin), Pb (lead), Te (tellurium), and Ca (calcium)."

bond:
  "bond_id": "The unique identifier of the bond. The format TRXXX_A1_A2 indicates a bond in molecule TRXXX between atom A1 and atom A2."
  "molecule_id": "The ID of the molecule in which the bond appears."
  "bond_type": "The type of bond. Possible values include '-' for a single bond, '=' for a double bond, and '#' for a triple bond."

connected:
  "atom_id": "The ID of the first atom in the connection."
  "atom_id2": "The ID of the second atom in the connection."
  "bond_id": "The ID of the bond that represents the connection between the two atoms."
  
molecule:
  "molecule_id": "The unique identifier of the molecule. A '+' indicates that the molecule or compound is carcinogenic, while a '-' indicates that it is not carcinogenic."
  "label": "Whether the molecule is carcinogenic ('+') or not ('-')."