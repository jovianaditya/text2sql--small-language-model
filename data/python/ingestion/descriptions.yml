# CALIFORNIA SCHOOLS
frpm: 
  "CDSCode": "The 14-digit California Department of Education (CDE) school code uniquely identifies the county, district, and individual school."
  "Academic Year": "The school year for which the data applies, typically represented in a YYYY-YYYY format (e.g., 2014-2015)."
  "County Code": "Numeric code representing the county in which the school or district is located."
  "District Code": "Numeric code identifying the school district."
  "School Code": "Numeric code identifying the individual school within the district."
  "County Name": "The full name of the county where the school or district is situated."
  "District Name": "The official name of the school district."
  "School Name": "The official name of the school."
  "District Type": "The type of district entity, such as 'County Office of Education (COE)' or other district classifications."
  "School Type": "The classification of the school, such as 'K-12 Schools (Public)', 'High Schools (Public)', etc."
  "Educational Option Type": "Describes the type of educational option provided by the school, for example 'Traditional'."
  "NSLP Provision Status": "Indicates participation status in the National School Lunch Program (may be blank if not applicable)."
  "Charter School (Y/N)": "A flag indicating whether the school is a charter school ('1' for yes, or '0' for no)."
  "Charter School Number": "The identification number assigned to the charter school, if applicable."
  "Charter Funding Type": "Indicates the funding method for the charter school, such as 'Directly funded'."
  "IRC": "Indicator for Independent Review Charter status or other classification (represented numerically)."
  "Low Grade": "The lowest grade level served by the school (e.g., K for Kindergarten, 9 for 9th grade)."
  "High Grade": "The highest grade level served by the school (e.g., 12 for 12th grade)."
  "Enrollment (K-12)": "Total number of students enrolled in grades Kindergarten through 12th grade."
  "Free Meal Count (K-12)": "Number of students eligible for free meals in grades K-12."
  "Percent (%) Eligible Free (K-12)": "The proportion of K-12 students eligible for free meals, expressed as a decimal fraction."
  "FRPM Count (K-12)": "Number of students eligible for Free or Reduced-Price Meals in grades K-12."
  "Percent (%) Eligible FRPM (K-12)": "The proportion of K-12 students eligible for Free or Reduced-Price Meals, expressed as a decimal fraction."
  "Enrollment (Ages 5-17)": "Number of enrolled students aged 5 to 17 years."
  "Free Meal Count (Ages 5-17)": "Number of students aged 5 to 17 eligible for free meals."
  "Percent (%) Eligible Free (Ages 5-17)": "The proportion of students aged 5 to 17 eligible for free meals, expressed as a decimal fraction."
  "FRPM Count (Ages 5-17)": "Number of students aged 5 to 17 eligible for Free or Reduced-Price Meals."
  "Percent (%) Eligible FRPM (Ages 5-17)": "The proportion of students aged 5 to 17 eligible for Free or Reduced-Price Meals, expressed as a decimal fraction."
  "2013-14 CALPADS Fall 1 Certification Status": "Indicates the certification status of the school or district's data for the 2013-14 CALPADS Fall 1 submission cycle."

satscores: 
  "cds": "The 14-digit California Department of Education (CDE) school code uniquely identifies the county, district, and individual school."
  "rtype": "This field indicates the record type, such as 'D' for district-level data and 'S' for school-level data"
  "sname": "This is the name of the school. For district records, this field may be blank."
  "dname": "This field shows the name of the district or district segment to which the school belongs"
  "cname": "This indicates the county name where the school or district is located"
  "enroll12": "This field represents the total student enrollment count for grades 1 through 12."
  "NumTstTakr": "The number of students from the school or district who took the SAT exam during the reporting period."
  "AvgScrRead": "The average SAT score achieved by test takers in the Reading section."
  "AvgScrMath": "The average SAT score achieved by test takers in the Math section."
  "AvgScrWrite": "The average SAT score achieved by test takers in the Writing section."
  "NumGE1500": "The number of test takers whose combined total SAT score is greater than or equal to 1500."

schools:
  "CDSCode": "14-digit California Department of Education school code, uniquely identifying the county, district, and school."
  "NCESDist": "National Center for Educational Statistics school district identification number. This field represents the 7-digit National Center for Educational Statistics (NCES) school district identification number. The first 2 digits identify the state and the last 5 digits identify the school district. Combined, they make a unique 7-digit ID for each school district"
  "NCESSchool": "National Center for Educational Statistics school identification number. This field represents the 5-digit NCES school identification number. The NCESSchool combined with the NCESDist form a unique 12-digit ID for each school."
  "StatusType": "This field identifies the status of the district. Active means the district is in operation and providing instructional services. Closed means the district is not in operation and no longer providing instructional services. Merged means the district has combined with another district or districts. Pending means the district has not opened for operation and instructional services yet but plans to open within the next 9-12 months."
  "County": "Name of the county in which the school or district is located."
  "District": "Name of the school district."
  "School": "Name of the school."
  "Street": "Full official street address of the location."
  "StreetAbr": "Abbreviated version of the street address (using common postal abbreviations)."
  "City": "City where the school or district's physical location is based."
  "Zip": "ZIP or ZIP+4 code for the physical address."
  "State": "Two-letter state abbreviation for the physical address (usually 'CA' for California)."
  "MailStreet": "Mailing address street for the school or district."
  "MailStrAbr": "Abbreviated form of the mailing address street."
  "MailCity": "City for the mailing address."
  "MailZip": "ZIP or ZIP+4 code for the mailing address."
  "MailState": "Two-letter state abbreviation for the mailing address."
  "Phone": "Primary phone number for the school or district."
  "Ext": "The phone number extension of the school, district, or administrative authority."
  "Website": "The website address of the school, district, or administrative authority."
  "OpenDate": "The date the school opened."
  "ClosedDate": "The date the school closed."
  "Charter": "Indicates whether the school is a charter school (0 = No, 1 = Yes)."
  "CharterNum": "Unique identification number assigned to the charter school. Only populated if Charter = 1."
  "FundingType": "Indicates the charter school's funding type. Possible values: 'Directly funded', 'Locally funded', 'Not in CS funding model' (known not to use charter funding), or blank (data not available or not applicable)."
  "DOC": "The District Ownership Code (DOC) is the numeric code used to identify the category of the Administrative Authority. 00 = County Office of Education; 02 = State Board of Education; 03 = Statewide Benefit Charter; 31 = State Special Schools; 34 = Non-school Location; 52 = Elementary School District; 54 = Unified School District; 56 = High School District; 98 = Regional Occupational Center/Program (ROC/P)."
  "DOCType": "Full name or description of the District Ownership Code."
  "SOC": "The School Ownership Code is a numeric code used to identify the type of school. (e.g., 09 = Special Education Schools (Public), 11 = Youth Authority Facilities (CEA), 13 = Opportunity Schools, 14 = Juvenile Court Schools, 15 = Other County or District Programs, 31 = State Special Schools, 60 = Elementary School (Public), 61 = Elementary School in One School District (Public), 62 = Intermediate/Middle Schools (Public), 63 = Alternative Schools of Choice, 64 = Junior High Schools (Public), 65 = K-12 Schools (Public), 66 = High Schools (Public), 67 = High Schools in One School District (Public), 68 = Continuation High Schools, 69 = District Community Day Schools, 70 = Adult Education Centers, 98 = Regional Occupational Center/Program (ROC/P))."
  "SOCType": "Full name or description of the School Ownership Code."
  "EdOpsCode": "Education Option Code indicating the type of education offered (e.g., ALTSOC = Alternative School of Choice, COMM = County Community School, COMMDAY = Community Day School, CON = Continuation School, JUV = Juvenile Court School, OPP = Opportunity School, YTH = Youth Authority School, SSS = State Special School, SPEC = Special Education School, TRAD = Traditional, ROP = Regional Occupational Program, HOMHOS = Home and Hospital, SPECON = District Consortia Special Education School)."
  "EdOpsName": "Full name or description of the Educational Operations Code."
  "EILCode": "Educational Instruction Level Code indicating the institution's type relative to the grade range served (e.g., ELEM = Elementary, ELEMHIGH = Elementary-High Combination, HS = High School, INTMIDJR = Intermediate/Middle/Junior High, PS = Preschool, UG = Ungraded)."
  "EILName": "Educational Instruction Level Name providing the full text description of the institution's type relative to the grade range served."
  "GSoffered": "Lowest and highest grade levels offered or supported by the school, district, or administrative authority; may differ from GSserved in CALPADS Fall 1 data. Example: 'P-Adult'."
  "GSserved": "he range from the lowest to highest grade level in which students are enrolled, based on the most recent certified CALPADS Fall 1 data; only K-12 enrollment is reported in CALPADS, and this range may differ from the grade span offered."
  "Virtual": "This field identifies the type of virtual instruction offered by the school, where students and teachers are separated by time and/or location and interact via computers or telecommunications technologies. It uses the following codes: F for Exclusively Virtual, meaning the school has no physical building and all instruction is virtual; V for Primarily Virtual, where virtual instruction is the main mode but some physical meetings occur; C for Primarily Classroom, where virtual courses exist but in-person instruction is primary; N for Not Virtual, indicating no virtual instruction is offered; and P for Partial Virtual, meaning some but not all instruction is virtual, though this code was retired after the 2016-17 school year."
  "Magnet": "This field identifies whether a school is a magnet school and/or offers a magnet program. It is coded as 1 if the school is a magnet school or provides a magnet program, and 0 if it does not. Note that preschools and adult education centers do not have a magnet school indicator."
  "Latitude": "The angular distance (expressed in degrees) between the location of the school, district, or administrative authority and the equator measured north to south."
  "Longitude": "The angular distance (expressed in degrees) between the location of the school, district, or administrative authority and the prime meridian (Greenwich, England) measured from west to east."
  "AdmFName1": "This field contains the first name of the superintendent or principal. Only active and pending districts and schools will display this administrator information if applicable."
  "AdmLName1": "This field contains the last name of the superintendent or principal. Only active and pending districts and schools will display this administrator information if applicable."
  "AdmEmail1": "This field contains the email address of the superintendent or principal. Only active and pending districts and schools will display this administrator information if applicable."
  "AdmFName2": "This field is similar to AdmFName1 and contains an additional administrator's first name if available."
  "AdmLName2": "This field contains the last name corresponding to the second administrator's first name."
  "AdmEmail2": "This field contains the email address corresponding to the second administrator."
  "AdmFName3": "Represent the first name, last name, and email address of a third administrator, but these fields are generally not used or left empty."
  "AdmLName3": "Represent the first name, last name, and email address of a third administrator, but these fields are generally not used or left empty."
  "AdmEmail3": "Represent the first name, last name, and email address of a third administrator, but these fields are generally not used or left empty."
  "LastUpdate": "When is this record updated last time."

# CARD GAMES
cards:
  "id": "Unique id number identifying the cards"
  "artist": "The name of the artist that illustrated the card art."
  "asciiName": "The ASCII code formatted card name with no special unicode characters."
  "availability": "A list of the card's printing types available, such as A list of the card's printing types available, such as 'arena', 'dreamcast', 'mtgo', 'paper', and 'shandalar'."
  "borderColor": "The color of the card's border. Possible values include 'black', 'borderless', 'gold', 'silver', and 'white'."
  "cardKingdomFoilId": "A unique identifier for the foil version of a card in the Card Kingdom system. When used together with cardKingdomId, it enables precise identification of specific foil card variants."
  "cardKingdomId": "A unique identifier for the card in the Card Kingdom system. It represents the specific card edition or printing."
  "colorIdentity": "A list of all the colors found in manaCost, colorIndicator, and text."
  "colorIndicator": "A list of all the colors in the color indicator (The symbol prefixed to a card's types)."
  "colors": "A list of all the colors in manaCost and colorIndicator. Some cards may not have values, such as cards with 'Devoid' in its text."
  "convertedManaCost": "The converted mana cost of the card. Use the manaValue property. if value is higher, it means that this card cost more converted mana."
  "duelDeck": "The indicator for which duel deck the card is in."
  "edhrecRank": "The card rank on EDHRec."
  "faceConvertedManaCost": "The converted mana cost or mana value for the face for either half or part of the card. if value is higher, it means that this card cost more converted mana for the face."
  "faceName": "The name on the face of the card."
  "flavorName": "The promotional card name printed above the true card name on special cards that has no game function. The promotional card name printed above the true card name on special cards that has no game function."
  "flavorText": "The italicized text found below the rules text that has no game function. The italicized text found below the rules text that has no game function."
  "frameEffects": "A list of visual effects applied to the card's frame. Examples include 'colorshifted', 'companion', 'devoid', 'fullart', 'textless', and others that alter the card's appearance."
  "frameVersion": "The year or style version of the card's frame design. Possible values include '1993', '1997', '2003', '2015', or 'future', indicating the specific frame style edition."
  "hand": "The modifier to the starting maximum hand size. It is represented as an integer with a preceding '+' or '-' sign (e.g., +1 or -1), indicating how much the hand size is increased or decreased. A value of 0 means no change to the default hand size."
  "hasAlternativeDeckLimit": "This indicates whether the card allows a deck limit different from the standard four copies. A value of 0 means it does not allow an alternative deck limit, so the standard limit applies. A value of 1 means it allows an alternative deck limit."
  "hasContentWarning": "This indicates whether the card has been marked for containing sensitive content. A value of 0 means the card does not have a content warning, while a value of 1 means it has been flagged for sensitive content by the publisher. Cards with this property may have missing or incomplete information."
  "hasFoil": "Indicates whether the card can be found in foil. A value of 0 means it cannot be found in foil, and 1 means it can."
  "hasNonFoil": "Indicates whether the card can be found in non-foil. A value of 0 means it cannot be found in non-foil, and 1 means it can."
  "isAlternative": " Indicates whether the card is an alternate variation of an original printing. A value of 0 means it is not, and 1 means it is."
  "isFullArt": "Indicates whether the card has full artwork. A value of 0 means it does not, and 1 means it does."
  "isOnlineOnly": "Indicates whether the card is only available in online game versions. A value of 0 means it is not, and 1 means it is."
  "isOversized": "Indicates whether the card is oversized. A value of 0 means it is not, and 1 means it is."
  "isPromo": "Indicates whether the card is a promotional printing. A value of 0 means it is not, and 1 means it is."
  "isReprint": "Indicates whether the card has been reprinted. A value of 0 means it has not, and 1 means it has."
  "isReserved": "Indicates whether the card is on the Reserved List. A value of 0 means it is not, and 1 means it is."
  "isStarter": "Indicates whether the card is found in a starter deck such as Planeswalker or Brawl decks. A value of 0 means it is not, and 1 means it is."
  "isStorySpotlight": "Indicates whether the card is a Story Spotlight card. A value of 0 means it is not, and 1 means it is."
  "isTextless": "Indicates whether the card lacks a text box. A value of 0 means the card has a text box, and 1 means it does not."
  "isTimeshifted": "Indicates whether the card is time shifted. Time shifted cards have a different frame version, a feature present in certain sets."
  "keywords": "A list of keywords that appear on the card."
  "layout": "The card's layout type. For token cards, this value will be 'token'."
  "leadershipSkills": "A list of formats in which the card is legal to be used as a commander."
  "life": "The starting life total modifier for the card. This is expressed as an integer preceded by a plus (+) or minus (-) sign."
  "loyalty": "The card's starting loyalty value. This is applicable only to cards with 'Planeswalker' in their types. An empty value means the loyalty is unknown."
  "manaCost": "The mana cost of the card, shown with each mana symbol wrapped in brackets."
  "mcmId": "The unique identifier assigned by the Magic Card Market (MCM) database for the card."
  "mcmMetaId": "A secondary identifier related to the Magic Card Market metadata for the card."
  "mtgArenaId": "The identifier used for the card in the MTG Arena digital platform (May be empty if not applicable)."
  "mtgjsonV4Id": "The unique identifier assigned to the card in the MTGJSON version 4 dataset, formatted as a UUID."
  "mtgoFoilId": "The identifier for the foil version of the card in Magic: The Gathering Online (MTGO) (May be empty if not applicable)."
  "mtgoId": "The identifier for the non-foil version of the card in Magic: The Gathering Online (MTGO) (May be empty if not applicable)."
  "multiverseId": "The unique identifier assigned to the card in the official Wizards of the Coast Multiverse database."
  "name": "The name of the card. Cards with multiple faces, such as 'Split' or 'Meld' cards, use a delimiter to separate the names."
  "number": "The card's assigned number."
  "originalReleaseDate": "The original release date of the card in ISO 8601 format. This is used for promotional cards printed outside the usual cycle window, such as Secret Lair Drop promotions."
  "originalText": "The text as it appeared on the card when originally printed."
  "originalType": "The card's original type as printed, including any supertypes and subtypes."
  "otherFaceIds": "A list of UUIDs representing this card's related faces, such as transformed or melded versions."
  "power": "The power value of the card. An infinity symbol (∞) means infinite power. A null or asterisk (*) indicates unknown power."
  "printings": "A list of set printing codes where the card was printed, formatted in uppercase letters."
  "promoTypes": "A list of promotional types associated with the card. Examples include 'arenaleague', boxtopper', 'bundle', 'convention', 'draftweekend', 'fnm', 'gameday', 'prerelease', 'stamped', 'tourney', and others."
  "purchaseUrls": "URLs linking to websites where the card can be purchased."
  "rarity": "The rarity level of the card printing."
  "scryfallId": "The unique identifier for the card in the Scryfall database, formatted as a UUID."
  "scryfallIllustrationId": "The unique identifier for the card's artwork."
  "scryfallOracleId": "The unique identifier for the card's Oracle text version in the Scryfall database, formatted as a UUID."
  "setCode": "The set printing code identifying which set the card belongs to."
  "side": "The identifier for the card's side, used for cards with multiple faces on the same card. If this value is empty, the card does not have multiple faces on the same card."
  "subtypes": "A list of the card's subtypes, which appear after the em-dash (—) in the card's type line."
  "supertypes": "A list of the card's supertypes, which appear before the em-dash (—) in the card's type line. The full set of card types is the union of supertypes and subtypes."
  "tcgplayerProductId": "The product identifier used by TCGplayer, a marketplace for trading card games."
  "text": "The official rules text printed on the card."
  "toughness": "The toughness value of the card, typically used for creatures to represent how much damage they can take."
  "type": "The visible type line of the card, including any supertypes and subtypes. Examples include 'Artifact', 'Creature', 'Enchantment', 'Instant', 'Land', 'Planeswalker', 'Sorcery', 'Token', and others."
  "types": "A list of all card types applicable to the card, including those from Un-sets and gameplay variants."
  "uuid": "The universally unique identifier (UUID, version 5) generated by MTGJSON. Each card entry has a unique UUID (Not generally used for gameplay)."
  "variations": "A list or reference to variations of this card (such as alternate art or printings)."
  "watermark": "The name of the watermark symbol printed on the card, if any."

foreign_data:
  "id": "Unique numeric identifier for this row in the foreign_data table. Does not change between updates."
  "flavorText": "The card's flavor text in the specified foreign language. This is thematic text that appears in italics on the card and has no gameplay effect."
  "language": "The language in which the card's name, text, and flavor text are printed. Examples: 'German', 'Spanish'."
  "multiverseid": "The official multiverse identifier assigned by Wizards of the Coast for this specific printing in the given language."
  "name": "The card's name as it appears in the specified foreign language."
  "text": "The card's rules text in the specified foreign language, including abilities, keywords, and effects."
  "type": "The full type line of the card in the specified foreign language, including supertypes, card types, and subtypes."
  "uuid": "The universal unique identifier (UUID) of the card that links this foreign-language printing to its corresponding main card record."

legalities:
  "id": "Unique numeric identifier for this row in the legalities table. Used internally for referencing and indexing."
  "format": "The official Magic: The Gathering format name (e.g., 'Commander', 'Legacy', 'Duel'). Each format has its own deck-building rules and banlist."
  "status": "The card's legality status in the specified format. Common values include: 'Legal' (can be played without restrictions), 'Banned' (cannot be played), and 'Restricted' (limited to one copy in a deck)."
  "uuid": "The universal unique identifier (UUID) that links this legality entry to its corresponding card record."

rulings:
  "id": "Unique numeric identifier for this row in the rulings table. Used internally for referencing and indexing."
  "date": "The official date when this ruling was issued or published, in YYYY-MM-DD format."
  "text": "The full text of the ruling, describing official clarifications or interactions for the card's abilities and effects."
  "uuid": "The universal unique identifier (UUID) linking this ruling to its corresponding card record."

set_translations:
  "id": "Unique numeric identifier for this row in the set_translations table. Used internally for referencing and indexing."
  "language": "The language in which the set name is translated. Examples: 'Chinese Simplified', 'French'."
  "setCode": "The official three-letter (or alphanumeric) set code assigned by Wizards of the Coast to identify the set."
  "translation": "The localized name of the set in the specified language."

sets:
  "id": "Unique numeric identifier for this row in the sets table. Used internally for referencing and indexing."
  "baseSetSize": "The official number of cards in the set, excluding promotional or alternate versions."
  "block": "The name of the block or thematic group of sets that this set belongs to. May be null for standalone sets."
  "booster": "Structured data describing the contents of a booster pack for this set, including card rarities, counts, weights, and sheet assignments."
  "code": "The official set code assigned by Wizards of the Coast, typically three or four characters (e.g., '10E', '2ED')."
  "isFoilOnly": "Indicates whether all cards in the set are printed only in foil."
  "isForeignOnly": "Indicates whether the set was only released in non-English languages."
  "isNonFoilOnly": "Indicates whether all cards in the set are printed only in non-foil."
  "isOnlineOnly": "Indicates whether the set was released exclusively for online play (e.g., Magic Online)."
  "isPartialPreview": "Indicates whether the set is still in preview (spoiler) status and does not yet have complete data."
  "keyruneCode": "The Keyrune code used for matching set image icons, typically corresponding to the official set code."
  "mcmId": "The MagicCardMarket (MKM) set identifier for this set. Used to match set data with MKM listings."
  "mcmIdExtras": "The secondary MagicCardMarket set identifier, used when a set is split into multiple parts or printings."
  "mcmName": "The official set name as listed on MagicCardMarket."
  "mtgoCode": "The set code as it appears in Magic: The Gathering Online. If null or empty, the set is not available on MTGO."
  "name": "The full English name of the set."
  "parentCode": "The set code of the parent set for related variations (e.g., promotional sets, special editions, guild kits)."
  "releaseDate": "The official release date of the set in ISO 8601 format (YYYY-MM-DD)."
  "tcgplayerGroupId": "The group identifier for the set on TCGplayer, used for linking to marketplace listings."
  "totalSetSize": "The total number of cards officially in the set, including promotional cards and supplemental products, but excluding Alchemy-specific modifications."
  "type": "The set's expansion type. Possible values include: 'alchemy', 'archenemy', 'arsenal', 'box', 'commander', 'core', 'draft_innovation', 'duel_deck', 'expansion', 'from_the_vault', 'funny', 'masterpiece', 'masters', 'memorabilia', 'planechase', 'premium_deck', 'promo', 'spellbook', 'starter', 'token', 'treasure_chest', 'vanguard'."

# CODEBASE COMMUNITY
badges:
  "Id": "Unique numeric identifier for this badge record."
  "UserId": "Unique identifier of the user who earned the badge."
  "Name": "The name of the badge earned by the user (e.g., 'Teacher')."
  "Date": "The timestamp (in YYYY-MM-DD HH:MM:SS format) when the user earned the badge."

comments:
  "Id": "Unique numeric identifier for this comment."
  "PostId": "Unique identifier of the post that this comment is associated with."
  "Score": "The score of the comment, representing community upvotes minus downvotes. Higher scores indicate more positively received comments."
  "Text": "The full text content of the comment."
  "CreationDate": "The timestamp (in YYYY-MM-DD HH:MM:SS format) when the comment was created."
  "UserId": "Unique identifier of the user who posted the comment. May be null if the comment was posted by an unregistered user."
  "UserDisplayName": "The display name of the user who posted the comment, if available."

posthistory:
  "Id": "Unique numeric identifier for this post history record."
  "PostHistoryTypeId": "Identifier for the type of post history event (e.g., initial title, body edit, tag edit)."
  "PostId": "Unique identifier of the post associated with this history record."
  "RevisionGUID": "Globally unique identifier (GUID) for the specific revision of the post."
  "CreationDate": "The timestamp (in YYYY-MM-DD HH:MM:SS format) when this history record was created."
  "UserId": "Unique identifier of the user who made the change recorded in this history entry. May be null if made anonymously or by the system."
  "Text": "The text content associated with this history record, which can be a post title, body, or tags depending on the PostHistoryTypeId."
  "Comment": "Optional short comment describing the reason for the change."
  "UserDisplayName": "Display name of the user who made the change, if available."

postlinks:
  "Id": "Unique numeric identifier for this post link record."
  "CreationDate": "The timestamp (in YYYY-MM-DD HH:MM:SS format) when the link between the posts was created."
  "PostId": "Unique identifier of the source post in this link relationship."
  "RelatedPostId": "Unique identifier of the target post that is related to the source post."
  "LinkTypeId": "Identifier for the type of relationship between the two posts (e.g., '1' for linked, '3' for duplicate)."

posts:
  "Id": "Unique numeric identifier for the post."
  "PostTypeId": "Identifier for the type of post (e.g., 1 = Question, 2 = Answer)."
  "AcceptedAnswerId": "Unique identifier of the accepted answer for this post, if it is a question. Null if no answer has been accepted."
  "CreaionDate": "Timestamp (YYYY-MM-DD HH:MM:SS) when the post was originally created."
  "Score": "The net score of the post (upvotes minus downvotes). Higher scores generally indicate better reception."
  "ViewCount": "The number of times this post has been viewed. Higher values suggest greater popularity or visibility."
  "Body": "The HTML-formatted content of the post's main body."
  "OwnerUserId": "Unique identifier of the user who created the post. Null if the post was created by an unregistered or anonymous user."
  "LasActivityDate": "The timestamp of the most recent activity on this post (e.g., edit, comment, or answer)."
  "Title": "The post's title, present only for question-type posts."
  "Tags": "A list of tags associated with the post, usually enclosed in angle brackets (e.g., <tag1><tag2>)."
  "AnswerCount": "The total number of answers for the post. Only applies to question-type posts."
  "CommentCount": "The total number of comments on the post."
  "FavoriteCount": "The total number of times the post has been marked as a favorite by users. Higher values typically indicate that the post is more valuable or useful."
  "LastEditorUserId": "The user ID of the last person who edited the post. Null if no edits have been made after creation."
  "LastEditDate": "The timestamp when the post was last edited."
  "CommunityOwnedDate": "The timestamp when the post became community-owned. Community-owned posts can be edited by a wider range of users and do not accrue reputation for the original owner."
  "ParentId": "The ID of the parent post. If null, this post is a root post (e.g., a question). If not null, the post is a child post (e.g., an answer) linked to the parent."
  "ClosedDate": "The timestamp when the post was closed. Null means the post is still open; non-null means it has been closed (e.g., as off-topic, duplicate, etc.)."
  "OwnerDisplayName": "The display name of the post's creator, if available. Used when the creator does not have a registered account."
  "LastEditorDisplayName": "The display name of the user who last edited the post, if available."

tags:
