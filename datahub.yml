networks:
  default:
    name: datahub_network
    driver: bridge

services:
  kafka:
    image: confluentinc/cp-kafka:8.0.0    # KRaft (no ZooKeeper)
    container_name: kafka
    environment:
      # ---- KRaft required ----
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:${DATAHUB_KAFKA_BROKER_PORT:-9092}"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "${KAFKA_CLUSTER_ID}"

      # ---- Single broker conveniences ----
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_MESSAGE_MAX_BYTES: "5242880"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "5242880"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "${DATAHUB_KAFKA_BROKER_PORT:-9092}:9092"
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "bash", "-lc", "kafka-topics --bootstrap-server kafka:${DATAHUB_KAFKA_BROKER_PORT:-9092} --list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.0.0
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:${DATAHUB_KAFKA_BROKER_PORT:-9092}"
      # PLAINTEXT is default; include if you prefer explicit:
      # SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: "PLAINTEXT"
    ports:
      - "${DATAHUB_SCHEMA_REGISTRY_PORT:-8081}:8081"
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "bash", "-lc", "nc -z schema-registry ${DATAHUB_SCHEMA_REGISTRY_PORT:-8081}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE_DATAHUB}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --log_bin_trust_function_creators=1
    ports:
      - ${MYSQL_PORT:-3306}:3306
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./data/sql_init/classicmodels.sql:/docker-entrypoint-initdb.d/classicmodels.sql:ro
      - ./data/sql_init/permission.sql:/docker-entrypoint-initdb.d/permission.sql:ro
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "bash", "-lc", "mysqladmin ping -hmysql -uroot -p$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure

  mysql-setup:
    depends_on:
      mysql:
        condition: service_healthy
    image: acryldata/datahub-mysql-setup:v1.2.0
    container_name: mysql-setup
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - DATAHUB_DB_NAME=${MYSQL_DATABASE_DATAHUB}
    labels:
      datahub_setup_job: true

  elasticsearch:
    environment:
      - discovery.type=single-node
      - ${XPACK_SECURITY_ENABLED:-xpack.security.enabled=false}
      - ES_JAVA_OPTS=-Xms384m -Xmx384m -Dlog4j2.formatMsgNoLookups=true
      - OPENSEARCH_JAVA_OPTS=-Xms384m -Xmx384m -Dlog4j2.formatMsgNoLookups=true
      - cluster.routing.allocation.disk.threshold_enabled=false
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test: curl -sS --fail http://elasticsearch:$${DATAHUB_ELASTIC_PORT:-9200}/_cluster/health?wait_for_status=yellow&timeout=0s
      timeout: 10s
    container_name: elasticsearch
    image: elasticsearch:7.10.1
    deploy:
      resources:
        limits:
          memory: 2g
    ports:
      - ${DATAHUB_ELASTIC_PORT:-9200}:9200
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data

  elasticsearch-setup:
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_USE_SSL=${ELASTICSEARCH_USE_SSL:-false}
      - USE_AWS_ELASTICSEARCH=${USE_AWS_ELASTICSEARCH:-false}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST}
      - ELASTICSEARCH_PORT=${DATAHUB_ELASTIC_PORT}
      - ELASTICSEARCH_PROTOCOL=http
    container_name: elasticsearch-setup
    image: acryldata/datahub-elasticsearch-setup:v1.2.0
    labels:
      datahub_setup_job: true

  kafka-setup:
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      - DATAHUB_PRECREATE_TOPICS=true
      - KAFKA_BOOTSTRAP_SERVER=kafka:${DATAHUB_KAFKA_BROKER_PORT}
      - USE_CONFLUENT_SCHEMA_REGISTRY=TRUE
      - SCHEMA_REGISTRY_URL=http://schema-registry:${DATAHUB_SCHEMA_REGISTRY_PORT}
    container_name: kafka-setup
    image: acryldata/datahub-kafka-setup:v1.2.0
    labels:
      datahub_setup_job: true

  datahub-upgrade:
    command:
      - -u
      - SystemUpdate
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
      kafka-setup:
        condition: service_completed_successfully
      mysql-setup:
        condition: service_completed_successfully
    environment:
      - EBEAN_DATASOURCE_USERNAME=${MYSQL_USER}
      - EBEAN_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - EBEAN_DATASOURCE_HOST=mysql:${MYSQL_PORT}
      - EBEAN_DATASOURCE_URL=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE_DATAHUB}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      - EBEAN_DATASOURCE_DRIVER=com.mysql.cj.jdbc.Driver
      - KAFKA_BOOTSTRAP_SERVER=kafka:${DATAHUB_KAFKA_BROKER_PORT}
      - KAFKA_SCHEMAREGISTRY_URL=http://schema-registry:${DATAHUB_SCHEMA_REGISTRY_PORT}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST}
      - ELASTICSEARCH_PORT=${DATAHUB_ELASTIC_PORT}
      - ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX=true
      - ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX=true
      - ELASTICSEARCH_BUILD_INDICES_CLONE_INDICES=false
      - GRAPH_SERVICE_IMPL=elasticsearch
      - DATAHUB_GMS_HOST=${DATAHUB_GMS_HOST}
      - DATAHUB_GMS_PORT=${DATAHUB_GMS_PORT}
      - ENTITY_REGISTRY_CONFIG_PATH=/datahub/datahub-gms/resources/entity-registry.yml
      - BACKFILL_BROWSE_PATHS_V2=true
      - REPROCESS_DEFAULT_BROWSE_PATHS_V2=false
    container_name: datahub-upgrade
    image: acryldata/datahub-upgrade:v1.2.0
    labels:
      datahub_setup_job: true

  datahub-gms:
    depends_on:
      datahub-upgrade:
        condition: service_completed_successfully
    environment:
      - DATAHUB_SERVER_TYPE=${DATAHUB_SERVER_TYPE:-quickstart}
      - DATAHUB_TELEMETRY_ENABLED=${DATAHUB_TELEMETRY_ENABLED:-true}
      - DATAHUB_UPGRADE_HISTORY_KAFKA_CONSUMER_GROUP_ID=generic-duhe-consumer-job-client-gms
      - EBEAN_DATASOURCE_DRIVER=com.mysql.cj.jdbc.Driver
      - EBEAN_DATASOURCE_HOST=mysql:${MYSQL_PORT}
      - EBEAN_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - EBEAN_DATASOURCE_URL=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE_DATAHUB}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      - EBEAN_DATASOURCE_USERNAME=${MYSQL_USER}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST}
      - ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX=true
      - ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX=true
      - ELASTICSEARCH_PORT=${DATAHUB_ELASTIC_PORT}
      - ENTITY_REGISTRY_CONFIG_PATH=/datahub/datahub-gms/resources/entity-registry.yml
      - ENTITY_SERVICE_ENABLE_RETENTION=true
      - ES_BULK_REFRESH_POLICY=WAIT_UNTIL
      - GRAPH_SERVICE_DIFF_MODE_ENABLED=true
      - GRAPH_SERVICE_IMPL=elasticsearch
      - JAVA_OPTS=-Xms768m -Xmx768m
      - KAFKA_BOOTSTRAP_SERVER=kafka:${DATAHUB_KAFKA_BROKER_PORT}
      - KAFKA_CONSUMER_STOP_ON_DESERIALIZATION_ERROR=${KAFKA_CONSUMER_STOP_ON_DESERIALIZATION_ERROR:-true}
      - KAFKA_SCHEMAREGISTRY_URL=http://schema-registry:${DATAHUB_SCHEMA_REGISTRY_PORT}
      - MAE_CONSUMER_ENABLED=true
      - MCE_CONSUMER_ENABLED=true
      - METADATA_SERVICE_AUTH_ENABLED=${METADATA_SERVICE_AUTH_ENABLED:-true}
      - DATAHUB_GMS_AUTH_TOKENS=${DATAHUB_TOKEN}
      - PE_CONSUMER_ENABLED=true
      - THEME_V2_DEFAULT=true
      - UI_INGESTION_ENABLED=true
      - KAFKA_CONSUMER_MAX_POLL_RECORDS=100
      - KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS=300000
      - KAFKA_CONSUMER_SESSION_TIMEOUT_MS=30000
      - KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS=10000
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 120s
      test: curl -sS --fail http://datahub-gms:${DATAHUB_GMS_PORT:-8080}/health
      timeout: 10s
    container_name: datahub-gms
    image: acryldata/datahub-gms:v1.2.0
    ports:
      - ${DATAHUB_GMS_PORT:-8080}:8080
    volumes:
      - ./data/datahub/plugins:/etc/datahub/plugins

  datahub-frontend-react:
    depends_on:
      datahub-gms:
        condition: service_healthy
    environment:
      - DATAHUB_GMS_HOST=datahub-gms
      - DATAHUB_GMS_PORT=8080
      - DATAHUB_SECRET=YouKnowNothing
      - DATAHUB_APP_VERSION=1.0
      - DATAHUB_PLAY_MEM_BUFFER_SIZE=10MB
      - JAVA_OPTS=-Xms256m -Xmx256m -Dhttp.port=9002 -Dconfig.file=datahub-frontend/conf/application.conf -Djava.security.auth.login.config=datahub-frontend/conf/jaas.conf -Dlogback.configurationFile=datahub-frontend/conf/logback.xml -Dlogback.debug=false -Dpidfile.path=/dev/null
      - KAFKA_BOOTSTRAP_SERVER=kafka:${DATAHUB_KAFKA_BROKER_PORT}
      - DATAHUB_TRACKING_TOPIC=DataHubUsageEvent_v1
      - ELASTIC_CLIENT_HOST=elasticsearch
      - ELASTIC_CLIENT_PORT=${DATAHUB_ELASTIC_PORT}
    container_name: datahub-frontend-react
    image: acryldata/datahub-frontend-react:v1.2.0
    ports:
      - ${DATAHUB_FRONTEND_PORT:-9002}:9002
    volumes:
      - ./data/datahub/plugins:/etc/datahub/plugins

  mcp_server:
    build:
      context: ./data/python
      dockerfile: mcpserver
    container_name: mcp_server
    image: mcp-server:latest
    pull_policy: never 
    volumes:
      - ./data/python/mcp_server:/app/mcp_server
      - ./data/python/ingestion:/app/ingestion
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATAHUB_TOKEN=${DATAHUB_TOKEN}
    env_file:
      - ./.env
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; assert os.path.exists('/app')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mcp_client:
    build:
      context: ./data/python
      dockerfile: mcpclient
    container_name: mcp_client
    image: mcp-client:latest
    pull_policy: never 
    volumes:
      - ./data/python/mcp_client:/app
    ports:
      - "8888:8888"
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; assert os.path.exists('/app')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s