networks:
  default:
    name: datahub_network
    driver: bridge

services:
  kafka:
    image: bitnami/kafka:3.6
    container_name: kafka
    environment:
      # KRaft mode configuration
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Additional Kafka settings
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_CFG_MESSAGE_MAX_BYTES=5242880
      - KAFKA_CFG_REPLICA_FETCH_MAX_BYTES=5242880
      - KAFKA_HEAP_OPTS=-Xms256m -Xmx256m
      # Auto-create topics
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1
    ports:
      - ${DATAHUB_MAPPED_KAFKA_BROKER_PORT:-9092}:9092
    volumes:
      - kafka_data:/bitnami/kafka
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: kafka-topics.sh --bootstrap-server kafka:9092 --list
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  schema-registry:
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - SCHEMA_REGISTRY_HOST_NAME=schema-registry
      - SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL=PLAINTEXT
      - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=kafka:9092
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test: nc -z schema-registry ${DATAHUB_SCHEMA_REGISTRY_PORT:-8081}
      timeout: 5s
    container_name: schema-registry
    image: confluentinc/cp-schema-registry:7.4.0
    deploy:
      resources:
        limits:
          memory: 512m
    ports:
      - ${DATAHUB_MAPPED_SCHEMA_REGISTRY_PORT:-8081}:8081

  postgresql:
    image: postgres:15
    container_name: postgresql
    environment:
      - POSTGRES_DB=datahub
      - POSTGRES_USER=datahub
      - POSTGRES_PASSWORD=datahub
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    ports:
      - ${DATAHUB_MAPPED_POSTGRES_PORT:-5432}:5432
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: pg_isready -U datahub -d datahub
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure

  postgres-setup:
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=datahub
      - POSTGRES_PASSWORD=datahub
      - DATAHUB_DB_NAME=datahub
    container_name: postgres-setup
    image: acryldata/datahub-postgres-setup:v1.2.0
    labels:
      datahub_setup_job: true

  elasticsearch:
    environment:
      - discovery.type=single-node
      - ${XPACK_SECURITY_ENABLED:-xpack.security.enabled=false}
      - ES_JAVA_OPTS=-Xms384m -Xmx384m -Dlog4j2.formatMsgNoLookups=true
      - OPENSEARCH_JAVA_OPTS=-Xms384m -Xmx384m -Dlog4j2.formatMsgNoLookups=true
      # Additional ES settings for better performance
      - cluster.routing.allocation.disk.threshold_enabled=false
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test: curl -sS --fail http://elasticsearch:$${DATAHUB_ELASTIC_PORT:-9200}/_cluster/health?wait_for_status=yellow&timeout=0s
      timeout: 10s
    container_name: elasticsearch
    image: elasticsearch:7.10.1
    deploy:
      resources:
        limits:
          memory: 2g
    ports:
      - ${DATAHUB_MAPPED_ELASTIC_PORT:-9200}:9200
    volumes:
      - esdata:/usr/share/elasticsearch/data

  elasticsearch-setup:
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_USE_SSL=${ELASTICSEARCH_USE_SSL:-false}
      - USE_AWS_ELASTICSEARCH=${USE_AWS_ELASTICSEARCH:-false}
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_PROTOCOL=http
    container_name: elasticsearch-setup
    image: acryldata/datahub-elasticsearch-setup:v1.2.0
    labels:
      datahub_setup_job: true

  kafka-setup:
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      - DATAHUB_PRECREATE_TOPICS=true
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
      - USE_CONFLUENT_SCHEMA_REGISTRY=TRUE
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
    container_name: kafka-setup
    image: acryldata/datahub-kafka-setup:v1.2.0
    labels:
      datahub_setup_job: true

  datahub-upgrade:
    command:
      - -u
      - SystemUpdate
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
      kafka-setup:
        condition: service_completed_successfully
      postgres-setup:
        condition: service_completed_successfully
    environment:
      - EBEAN_DATASOURCE_USERNAME=datahub
      - EBEAN_DATASOURCE_PASSWORD=datahub
      - EBEAN_DATASOURCE_HOST=postgresql:5432
      - EBEAN_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/datahub
      - EBEAN_DATASOURCE_DRIVER=org.postgresql.Driver
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
      - KAFKA_SCHEMAREGISTRY_URL=http://schema-registry:8081
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX=true
      - ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX=true
      - ELASTICSEARCH_BUILD_INDICES_CLONE_INDICES=false
      - GRAPH_SERVICE_IMPL=elasticsearch
      - DATAHUB_GMS_HOST=datahub-gms
      - DATAHUB_GMS_PORT=8080
      - ENTITY_REGISTRY_CONFIG_PATH=/datahub/datahub-gms/resources/entity-registry.yml
      - BACKFILL_BROWSE_PATHS_V2=true
      - REPROCESS_DEFAULT_BROWSE_PATHS_V2=false
    container_name: datahub-upgrade
    image: acryldata/datahub-upgrade:v1.2.0
    labels:
      datahub_setup_job: true

  datahub-gms:
    depends_on:
      datahub-upgrade:
        condition: service_completed_successfully
    environment:
      - DATAHUB_SERVER_TYPE=${DATAHUB_SERVER_TYPE:-quickstart}
      - DATAHUB_TELEMETRY_ENABLED=${DATAHUB_TELEMETRY_ENABLED:-true}
      - DATAHUB_UPGRADE_HISTORY_KAFKA_CONSUMER_GROUP_ID=generic-duhe-consumer-job-client-gms
      - EBEAN_DATASOURCE_DRIVER=org.postgresql.Driver
      - EBEAN_DATASOURCE_HOST=postgresql:5432
      - EBEAN_DATASOURCE_PASSWORD=datahub
      - EBEAN_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/datahub
      - EBEAN_DATASOURCE_USERNAME=datahub
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX=true
      - ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX=true
      - ELASTICSEARCH_PORT=9200
      - ENTITY_REGISTRY_CONFIG_PATH=/datahub/datahub-gms/resources/entity-registry.yml
      - ENTITY_SERVICE_ENABLE_RETENTION=true
      - ES_BULK_REFRESH_POLICY=WAIT_UNTIL
      - GRAPH_SERVICE_DIFF_MODE_ENABLED=true
      - GRAPH_SERVICE_IMPL=elasticsearch
      - JAVA_OPTS=-Xms768m -Xmx768m
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
      - KAFKA_CONSUMER_STOP_ON_DESERIALIZATION_ERROR=${KAFKA_CONSUMER_STOP_ON_DESERIALIZATION_ERROR:-true}
      - KAFKA_SCHEMAREGISTRY_URL=http://schema-registry:8081
      - MAE_CONSUMER_ENABLED=true
      - MCE_CONSUMER_ENABLED=true
      - METADATA_SERVICE_AUTH_ENABLED=${METADATA_SERVICE_AUTH_ENABLED:-true}
      - DATAHUB_GMS_AUTH_TOKENS=${DATAHUB_TOKEN}
      - PE_CONSUMER_ENABLED=true
      - THEME_V2_DEFAULT=true
      - UI_INGESTION_ENABLED=true
      # Additional settings for better reliability
      - KAFKA_CONSUMER_MAX_POLL_RECORDS=100
      - KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS=300000
      - KAFKA_CONSUMER_SESSION_TIMEOUT_MS=30000
      - KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS=10000
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 120s
      test: curl -sS --fail http://datahub-gms:${DATAHUB_GMS_PORT:-8080}/health
      timeout: 10s
    container_name: datahub-gms
    image: acryldata/datahub-gms:v1.2.0
    ports:
      - ${DATAHUB_MAPPED_GMS_PORT:-8080}:8080
    volumes:
      - ${HOME}/.datahub/plugins:/etc/datahub/plugins

  datahub-frontend-react:
    depends_on:
      datahub-gms:
        condition: service_healthy
    environment:
      - DATAHUB_GMS_HOST=datahub-gms
      - DATAHUB_GMS_PORT=8080
      - DATAHUB_SECRET=YouKnowNothing
      - DATAHUB_APP_VERSION=1.0
      - DATAHUB_PLAY_MEM_BUFFER_SIZE=10MB
      - JAVA_OPTS=-Xms256m -Xmx256m -Dhttp.port=9002 -Dconfig.file=datahub-frontend/conf/application.conf -Djava.security.auth.login.config=datahub-frontend/conf/jaas.conf -Dlogback.configurationFile=datahub-frontend/conf/logback.xml -Dlogback.debug=false -Dpidfile.path=/dev/null
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
      - DATAHUB_TRACKING_TOPIC=DataHubUsageEvent_v1
      - ELASTIC_CLIENT_HOST=elasticsearch
      - ELASTIC_CLIENT_PORT=9200
    container_name: datahub-frontend-react
    image: acryldata/datahub-frontend-react:v1.2.0
    ports:
      - ${DATAHUB_MAPPED_FRONTEND_PORT:-9002}:9002
    volumes:
      - ${HOME}/.datahub/plugins:/etc/datahub/plugins

  mcp_server:
    build:
      context: ./data/python
      dockerfile: mcpserver
    container_name: mcp_server
    image: mcp-server:latest
    volumes:
      - ./data/python/mcp_server:/app
      - ./data/python/ingestion:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; assert os.path.exists('/app')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mcp_client:
    build:
      context: ./data/python
      dockerfile: mcpclient
    container_name: mcp_client
    image: mcp-client:latest
    volumes:
      - ./data/python/mcp_client:/app
    ports:
      - "8888:8888"
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; assert os.path.exists('/app')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  kafka_data:
  esdata: